Quoc V. Le, Ilya Sutskever, Oriol Vinyals, and Lukasz Kaiser. Multi-task sequence to sequence learning. arXiv preprint arXiv:1511.06114, 2015.\n\n[24] Minh-Thang Luong, Hieu Pham, and Christopher D Manning. Effective approaches to attention-based neural machine translation. arXiv preprint arXiv:1508.04025, 2015.\n\n[25] Mitchell P Marcus, Mary Ann Marcinkiewicz, and Beatrice Santorini. Building a large annotated corpus of english: The penn treebank. Computational linguistics, 19(2):313–330, 1993.\n\n[26] David McClosky, Eugene Charniak, and Mark Johnson. Effective self-training for parsing. In Proceedings of the Human Language Technology Conference of the NAACL, Main Conference, pages 152–159. ACL, June 2006.\n\n[27] Ankur Parikh, Oscar Täckström, Dipanjan Das, and Jakob Uszkoreit. A decomposable attention model. In Empirical Methods in Natural Language Processing, 2016.\n\n[28] Romain Paulus, Caiming Xiong, and Richard Socher. A deep reinforced model for abstractive summarization. arXiv preprint arXiv:1705.04304, 2017.\n\n[29] Slav Petrov, Leon Barrett, Romain Thibaux, and Dan Klein. Learning accurate, compact, and interpretable tree annotation. In Proceedings of the 21st International Conference on Computational Linguistics and 44th Annual Meeting of the ACL, pages 433–440. ACL, July 2006.\n\n[30] Ofir Press and Lior Wolf. Using the output embedding to improve language models. arXiv preprint arXiv:1608.05859, 2016.\n\n[31] Rico Sennrich, Barry Haddow, and Alexandra Birch. Neural machine translation of rare words with subword units. arXiv preprint arXiv:1508.07909, 2015.\n\n[32] Noam Shazeer, Azalia Mirhoseini, Krzysztof Maziarz, Andy Davis, Quoc Le, Geoffrey Hinton, and Jeff Dean. Outrageously large neural networks: The sparsely-gated mixture-of-experts layer. arXiv preprint arXiv:1701.06538, 2017.\n\n[33] Nitish Srivastava, Geoffrey E Hinton, Alex Krizhevsky, Ilya Sutskever, and Ruslan Salakhutdinov. Dropout: a simple way to prevent neural networks from overfitting. Journal of Machine Learning Research, 15(1):1929–1958, 2014.\n\n[34] Sainbayar Sukhbaatar, Arthur Szlam, Jason Weston, and Rob Fergus. End-to-end memory networks. In C. Cortes, N. D. Lawrence, D. D. Lee, M. Sugiyama, and R. Garnett, editors, Advances in Neural Information Processing Systems 28, pages 2440–2448. Curran Associates, Inc., 2015.\n\n[35] Ilya Sutskever, Oriol Vinyals, and Quoc VV Le. Sequence to sequence learning with neural networks. In Advances in Neural Information Processing Systems, pages 3104–3112, 2014.\n\n[36] Christian Szegedy, Vincent Vanhoucke, Sergey Ioffe, Jonathon Shlens, and Zbigniew Wojna. Rethinking the inception architecture for computer vision. CoRR, abs/1512.00567, 2015.\n\n[37] Vinyals & Kaiser, Koo, Petrov, Sutskever, and Hinton. Grammar as a foreign language. In Advances in Neural Information Processing Systems, 2015.\n\n[38] Yonghui Wu, Mike Schuster, Zhifeng Chen, Quoc V Le, Mohammad Norouzi, Wolfgang Macherey, Maxim Krikun, Yuan Cao, Qin Gao, Klaus Macherey, et al. Google's neural machine translation system: Bridging the gap between human and machine translation. arXiv preprint arXiv:1609.08144, 2016.\n\n[39] Jie Zhou, Ying Cao, Xuguang Wang, Peng Li, and Wei Xu. Deep recurrent models with fast-forward connections for neural machine translation. CoRR, abs/1606.04199, 2016.\n\n[40] Muhua Zhu, Yue Zhang, Wenliang Chen, Min Zhang, and Jingbo Zhu. Fast and accurate shift-reduce constituent parsing. In Proceedings of the 51st Annual Meeting of the ACL (Volume 1: Long Papers), pages 434–443. ACL, August 2013.\n\n<!-- followed-by\n- [Appendix](appendix.md)\n-->\n","tables/table_0":"\n## Layer Complexity and Path Length\n\n<table><tr><td>Layer Type</td><td>Complexity per Layer</td><td>Sequential Operations</td><td>Maximum Path Length</td></tr><tr><td>Self-Attention</td><td>$ O(n^{2} \\cdot d) $</td><td>$ O(1) $</td><td>$ O(1) $</td></tr><tr><td>Recurrent</td><td>$ O(n \\cdot d^{2}) $</td><td>$ O(n) $</td><td>$ O(n) $</td></tr><tr><td>Convolutional</td><td>$ O(k \\cdot n \\cdot d^{2}) $</td><td>$ O(1) $</td><td>$ O(\\log_{k}(n)) $</td></tr><tr><td>Self-Attention (restricted)</td><td>$ O(r \\cdot n \\cdot d) $</td><td>$ O(1) $</td><td>$ O(n/r) $</td></tr></table>\n\n## Description\n\nThis table compares four sequence-processing layer types using the three criteria the paper uses to motivate self-attention: computational complexity per layer, the minimum number of sequential operations, and the maximum path length between positions. Here, $n$ is sequence length, $d$ is representation dimension, $k$ is convolution kernel size, and $r$ is the neighborhood size for restricted self-attention.\n\nFull self-attention has complexity $O(n^2d)$ but requires only $O(1)$ sequential operations and connects any two positions with an $O(1)$ path. A recurrent layer has complexity $O(nd^2)$ and requires both $O(n)$ sequential operations and an $O(n)$ maximum path. A convolutional layer permits $O(1)$ sequential operations but has complexity $O(knd^2)$ and a maximum path of $O(\\log_k(n))$ in the listed case. Restricted self-attention reduces complexity to $O(rnd)$ while increasing the maximum path to $O(n/r)$.\n\nThe paper’s central comparison is that self-attention is more parallelizable than recurrence and gives signals shorter paths across a sequence. It is also faster than recurrence when $n<d$, which the authors state is usually true for the sentence representations used by the machine-translation models they discuss. Restricted attention is presented as a possible tradeoff for very long sequences rather than as the configuration evaluated in this paper.\n\n<!-- cited-in\n- [4 Why Self-Attention](../source/04-why-self-attention.md)\n-->\n","tables/table_1":"\n## Translation Quality and Cost\n\n<table><tr><td rowspan=\"2\">Model</td><td colspan=\"2\">BLEU</td><td colspan=\"2\">Training Cost (FLOPs)</td></tr><tr><td>EN-DE</td><td>EN-FR</td><td>EN-DE</td><td>EN-FR</td></tr><tr><td>ByteNet [18]</td><td>23.75</td><td></td><td></td><td></td></tr><tr><td>Deep-Att + PosUnk [39]</td><td></td><td>39.2</td><td></td><td>$ 1.0 \\cdot 10^{20} $</td></tr><tr><td>GNMT + RL [38]</td><td>24.6</td><td>39.92</td><td>$ 2.3 \\cdot 10^{19} $</td><td>$ 1.4 \\cdot 10^{20} $</td></tr><tr><td>ConvS2S [9]</td><td>25.16</td><td>40.46</td><td>$ 9.6 \\cdot 10^{18} $</td><td>$ 1.5 \\cdot 10^{20} $</td></tr><tr><td>MoE [32]</td><td>26.03</td><td>40.56</td><td>$ 2.0 \\cdot 10^{19} $</td><td>$ 1.2 \\cdot 10^{20} $</td></tr><tr><td>Deep-Att + PosUnk Ensemble [39]</td><td></td><td>40.4</td><td></td><td>$ 8.0 \\cdot 10^{20} $</td></tr><tr><td>GNMT + RL Ensemble [38]</td><td>26.30</td><td>41.16</td><td>$ 1.8 \\cdot 10^{20} $</td><td>$ 1.1 \\cdot 10^{21} $</td></tr><tr><td>ConvS2S Ensemble [9]</td><td>26.36</td><td>41.29</td><td>$ 7.7 \\cdot 10^{19} $</td><td>$ 1.2 \\cdot 10^{21} $</td></tr><tr><td>Transformer (base model)</td><td>27.3</td><td>38.1</td><td colspan=\"2\">$ 3.3 \\cdot 10^{18} $</td></tr><tr><td>Transformer (big)</td><td>28.4</td><td>41.8</td><td colspan=\"2\">$ 2.3 \\cdot 10^{19} $</td></tr></table>\n\n## Description\n\nThis table compares translation quality and estimated training cost for the Transformer and previously published systems on the WMT 2014 newstest2014 English-to-German (EN-DE) and English-to-French (EN-FR) test sets. Quality is reported as BLEU, while training cost is reported as estimated floating-point operations. The comparison includes individual models and ensembles; empty cells indicate values not supplied in the table.\n\nThe Transformer base model reports 27.3 EN-DE BLEU and 38.1 EN-FR BLEU with a listed training cost of $3.3\\cdot10^{18}$ FLOPs. Transformer (big) reports 28.4 EN-DE and 41.8 EN-FR with $2.3\\cdot10^{19}$ FLOPs. For EN-DE, the strongest listed earlier ensemble reaches 26.36 BLEU, below both Transformer configurations. For EN-FR, Transformer (big) exceeds the listed previous results, whose highest value is 41.29 for the ConvS2S ensemble.\n\nThe table supports the paper’s claim that the Transformer improves BLEU while using substantially less training computation than the competitive systems shown. The accompanying section states that the big EN-DE model surpasses previously reported models, including ensembles, by more than 2 BLEU, while even the base model exceeds the earlier published results at a fraction of their training cost.\n\n<!-- cited-in\n- [6.1 Machine Translation](../source/06-results/06-01-machine-translation.md)\n-->\n","tables/table_2":"\n## Transformer Model Variations\n\n<table><tr><td></td><td>N</td><td>$ d_{model} $</td><td>$ d_{ff} $</td><td>h</td><td>$ d_{k} $</td><td>$ d_{v} $</td><td>$ P_{drop} $</td><td>$ \\epsilon_{ls} $</td><td>train steps</td><td>PPL (dev)</td><td>BLEU (dev)</td><td>params  $ \\times 10^{6} $</td></tr><tr><td>base</td><td>6</td><td>512</td><td>2048</td><td>8</td><td>64</td><td>64</td><td>0.1</td><td>0.1</td><td>100K</td><td>4.92</td><td>25.8</td><td>65</td></tr><tr><td rowspan=\"4\">(A)</td><td></td><td></td><td></td><td>1</td><td>512</td><td>512</td><td></td><td></td><td></td><td>5.29</td><td>24.9</td><td></td></tr><tr><td></td><td></td><td></td><td>4</td><td>128</td><td>128</td><td></td><td></td><td></td><td>5.00</td><td>25.5</td><td></td></tr><tr><td></td><td></td><td></td><td>16</td><td>32</td><td>32</td><td></td><td></td><td></td><td>4.91</td><td>25.8</td><td></td></tr><tr><td></td><td></td><td></td><td>32</td><td>16</td><td>16</td><td></td><td></td><td></td><td>5.01</td><td>25.4</td><td></td></tr><tr><td rowspan=\"2\">(B)</td><td></td><td></td><td></td><td></td><td>16</td><td></td><td></td><td></td><td></td><td>5.16</td><td>25.1</td><td>58</td></tr><tr><td></td><td></td><td></td><td></td><td>32</td><td></td><td></td><td></td><td></td><td>5.01</td><td>25.4</td><td>60</td></tr><tr><td rowspan=\"7\">(C)</td><td>2</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>6.11</td><td>23.7</td><td>36</td></tr><tr><td>4</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>5.19</td><td>25.3</td><td>50</td></tr><tr><td>8</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>4.88</td><td>25.5</td><td>80</td></tr><tr><td></td><td>256</td><td></td><td></td><td>32</td><td>32</td><td></td><td></td><td></td><td>5.75</td><td>24.5</td><td>28</td></tr><tr><td></td><td>1024</td><td></td><td></td><td>128</td><td>128</td><td></td><td></td><td></td><td>4.66</td><td>26.0</td><td>168</td></tr><tr><td></td><td></td><td>1024</td><td></td><td></td><td></td><td></td><td></td><td></td><td>5.12</td><td>25.4</td><td>53</td></tr><tr><td></td><td></td><td>4096</td><td></td><td></td><td></td><td></td><td></td><td></td><td>4.75</td><td>26.2</td><td>90</td></tr><tr><td rowspan=\"4\">(D)</td><td></td><td></td><td></td><td></td><td></td><td></td><td>0.0</td><td></td><td></td><td>5.77</td><td>24.6</td><td></td></tr><tr><td></td><td></td><td></td><td></td><td></td><td></td><td>0.2</td><td></td><td></td><td>4.95</td><td>25.5</td><td></td></tr><tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>0.0</td><td></td><td>4.67</td><td>25.3</td><td></td></tr><tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>0.2</td><td></td><td>5.47</td><td>25.7</td><td></td></tr><tr><td>(E)</td><td colspan=\"9\">positional embedding instead of sinusoids</td><td>4.92</td><td>25.7</td><td></td></tr><tr><td>big</td><td>6</td><td>1024</td><td>4096</td><td>16</td><td></td><td></td><td>0.3</td><td></td><td>300K</td><td>4.33</td><td>26.4</td><td>213</td></tr></table>\n\n## Description\n\nThis table tests how changes to the Transformer base configuration affect English-to-German translation on the newstest2013 development set. Unlisted cells retain the base model’s values. The configuration columns specify the number of layers $N$, model dimension $d_{model}$, feed-forward dimension $d_{ff}$, number of heads $h$, key and value dimensions $d_k$ and $d_v$, dropout $P_{drop}$, label smoothing $\\epsilon_{ls}$, and training steps. Outcomes are development perplexity, development BLEU, and parameter count. The reported perplexities are per wordpiece and are not comparable to per-word perplexities.\n\nRows (A) vary the number and dimensions of attention heads while holding computation constant. One head gives 24.9 BLEU, 0.9 below the best listed setting, while quality also falls when the number reaches 32. Rows (B) reduce $d_k$ and show lower BLEU, which the authors interpret as evidence that computing compatibility is not easy. Rows (C) vary depth, model width, and feed-forward width; the paper summarizes these results as larger models performing better. Rows (D) vary dropout and label smoothing, with the authors highlighting dropout as important for avoiding overfitting. Row (E) replaces sinusoidal encodings with learned positional embeddings and produces nearly the same result as the base model: 25.7 versus 25.8 BLEU.\n\nThe base configuration has 65 million parameters, 4.92 perplexity, and 25.8 BLEU after 100K steps. The final big configuration increases $d_{model}$ to 1024, $d_{ff}$ to 4096, and $h$ to 16; after 300K steps it reports 213 million parameters, 4.33 perplexity, and 26.4 BLEU.\n\n<!-- cited-in\n- [6.2 Model Variations](../source/06-results/06-02-model-variations.md)\n-->\n","tables/table_3":"\n## Constituency Parsing Results\n\n<table><tr><td>Parser</td><td>Training</td><td>WSJ 23 F1</td></tr><tr><td>Vinyals &amp; Kaiser et al. (2014) [37]</td><td>WSJ only, discriminative</td><td>88.3</td></tr><tr><td>Petrov et al. (2006) [29]</td><td>WSJ only, discriminative</td><td>90.4</td></tr><tr><td>Zhu et al. (2013) [40]</td><td>WSJ only, discriminative</td><td>90.4</td></tr><tr><td>Dyer et al. (2016) [8]</td><td>WSJ only, discriminative</td><td>91.7</td></tr><tr><td>Transformer (4 layers)</td><td>WSJ only, discriminative</td><td>91.3</td></tr><tr><td>Zhu et al. (2013) [40]</td><td>semi-supervised</td><td>91.3</td></tr><tr><td>Huang &amp; Harper (2009) [14]</td><td>semi-supervised</td><td>91.3</td></tr><tr><td>McClosky et al. (2006) [26]</td><td>semi-supervised</td><td>92.1</td></tr><tr><td>Vinyals &amp; Kaiser et al. (2014) [37]</td><td>semi-supervised</td><td>92.1</td></tr><tr><td>Transformer (4 layers)</td><td>semi-supervised</td><td>92.7</td></tr><tr><td>Luong et al. (2015) [23]</td><td>multi-task</td><td>93.0</td></tr><tr><td>Dyer et al. (2016) [8]</td><td>generative</td><td>93.3</td></tr></table>\n\n## Description\n\nThis table compares English constituency parsers on Section 23 of the Wall Street Journal portion of the Penn Treebank. Each row identifies a parser, its training regime, and its WSJ Section 23 F1 score. The rows separate systems trained only on WSJ data from semi-supervised, multi-task, and generative systems, so the score should be read together with the training column.\n\nThe paper evaluates a four-layer Transformer with $d_{model}=1024$. With WSJ-only discriminative training on about 40,000 sentences, it reaches 91.3 F1. That is higher than the listed Petrov et al. parser at 90.4 and below the listed Dyer et al. result at 91.7 within the WSJ-only group. With semi-supervised training using corpora totaling approximately 17 million sentences, the Transformer reaches 92.7 F1, above the other semi-supervised results in the table, which range from 91.3 to 92.1. The remaining comparison rows report 93.0 for the Luong et al. multi-task system and 93.3 for the Dyer et al. generative system.\n\nThe table is used to show that the Transformer transfers beyond machine translation to a task whose outputs have strong structural constraints and are substantially longer than its inputs. The authors emphasize that these results were obtained with limited task-specific tuning.\n\n<!-- cited-in\n- [6.3 English Constituency Parsing](../source/06-results/06-03-english-constituency-parsing.md)\n-->\n","terms/core/attention-head":"\n## Attention Head\n\nAn attention head is one scaled dot-product attention operation within multi-head attention. Head $i$ does not receive the unmodified full-dimensional inputs. It first forms $QW_i^Q$, $KW_i^K$, and $VW_i^V$ with its own learned projection matrices, then computes $head_i=Attention(QW_i^Q,KW_i^K,VW_i^V)$. This gives every head a separately projected view of the same underlying query, key, and value inputs.\n\nEach head produces a $d_v$-dimensional output. Multi-head attention concatenates $head_1$ through $head_h$ and applies the output projection $W^O$. The base Transformer uses eight heads with $d_k=d_v=64$, one eighth of $d_{model}=512$. The lower dimension per head keeps the combined computational cost similar to that of a single attention operation at full model dimensionality.\n\nThe paper’s reason for using several heads is that they can attend to information from different representation subspaces and positions. A head is therefore a computational component, not a separate architectural attention type: heads are used inside encoder self-attention, masked decoder self-attention, and encoder-decoder attention. Those three applications differ in the origin of their queries, keys, and values, while the internal head computation remains scaled dot-product attention.\n\nThe experimental variation of head count shows that one head gives 24.9 development BLEU, compared with the best listed 25.8, while thirty-two small heads fall to 25.4. The paper’s appendix shows why head-specific outputs are also interesting to inspect. Different colored heads connect “making” with “more difficult”; heads 5 and 6 show sharp attention from “its” that the authors describe as apparently involved in anaphora resolution; and two other heads produce visibly different patterns that seem related to sentence structure. The authors use these examples to support the observation that individual heads learn different tasks.\n\n<!-- grounded-in\n- [2 Background](../../source/02-background.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2 Attention](../../source/03-model-architecture/03-02-attention/overview.md)\n- [3.2.2 Multi-Head Attention](../../source/03-model-architecture/03-02-attention/03-02-02-multi-head-attention.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [4 Why Self-Attention](../../source/04-why-self-attention.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n- [Attention Visualizations](../../source/attention-visualizations.md)\n-->\n","terms/core/attention-mechanism":"\n## Attention Mechanism\n\nAn attention function maps a query and a set of key-value pairs to an output. The query, keys, values, and output are vectors. A compatibility function compares the query with each key to determine a weight for the corresponding value, and the output is the weighted sum of those values. This lets a model connect positions without requiring the number of operations between them to grow with their distance in the sequence.\n\nAttention mechanisms were already used in sequence modeling before the Transformer, usually together with a recurrent network. The paper’s contribution is to make attention the foundation of the complete transduction architecture: the Transformer uses attention to compute representations on both the encoder and decoder sides without sequence-aligned recurrence or convolution. The authors describe it as drawing global dependencies between input and output while allowing substantially more parallelization.\n\nThe Transformer implements attention through scaled dot products. For matrices of queries $Q$, keys $K$, and values $V$, it computes $Attention(Q,K,V)=softmax(QK^T/\\sqrt{d_k})V$. The scaling factor counteracts large dot products at larger key dimensions. Multi-head attention repeats the operation on different learned projections of $Q$, $K$, and $V$, concatenates the head outputs, and projects them again. The paper uses eight heads in the base model so attention can operate across different representation subspaces and positions instead of averaging everything within one full-dimensional head.\n\nThe architecture applies attention in three distinct ways. Encoder self-attention obtains queries, keys, and values from the previous encoder layer, allowing every encoder position to attend to every position. Masked decoder self-attention obtains all three from the decoder but blocks later output positions. Encoder-decoder attention obtains queries from the previous decoder layer and keys and values from the encoder output, allowing every decoder position to attend across the input sequence.\n\nThe paper also uses attention distributions as evidence about learned behavior. Appendix examples show heads attending from “making” to the distant phrase “more difficult,” sharp patterns from “its” that the authors describe as apparently involved in anaphora resolution, and two heads with different patterns that seem related to sentence structure. The authors present these examples cautiously as indications that individual heads learn different tasks, not as fixed rules assigned to every attention head.\n\n<!-- grounded-in\n- [Abstract](../../source/abstract.md)\n- [1 Introduction](../../source/01-introduction.md)\n- [2 Background](../../source/02-background.md)\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2 Attention](../../source/03-model-architecture/03-02-attention/overview.md)\n- [3.2.1 Scaled Dot-Product Attention](../../source/03-model-architecture/03-02-attention/03-02-01-scaled-dot-product-attention.md)\n- [3.2.2 Multi-Head Attention](../../source/03-model-architecture/03-02-attention/03-02-02-multi-head-attention.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [3.3 Position-wise Feed-Forward Networks](../../source/03-model-architecture/03-03-position-wise-feed-forward-networks.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n- [4 Why Self-Attention](../../source/04-why-self-attention.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n- [6.3 English Constituency Parsing](../../source/06-results/06-03-english-constituency-parsing.md)\n- [7 Conclusion](../../source/07-conclusion.md)\n- [Attention Visualizations](../../source/attention-visualizations.md)\n-->\n","terms/core/decoder-stack":"\n## Decoder Stack\n\nThe decoder stack generates the output sequence $(y_1,\\ldots,y_m)$ one symbol at a time from the encoder representations and previously generated output symbols. The paper’s base model uses $N=6$ identical decoder layers. Each layer has three sub-layers, one more than an encoder layer, because the decoder must model its existing output context and also read from the encoder.\n\nAt the bottom of the stack, output tokens shifted one position to the right are converted into learned $d_{model}$-dimensional embeddings. The embedding weights are multiplied by $\\sqrt{d_{model}}$, positional encodings are added, and dropout is applied to the sum during training. The shift is part of the auto-regressive constraint: the representation aligned with a prediction contains only earlier output symbols.\n\nThe first sub-layer in each decoder layer is masked multi-head self-attention. Its queries, keys, and values come from the decoder representation, but scores for subsequent positions are blocked. The second sub-layer is multi-head encoder-decoder attention. The paper describes its queries as coming from the previous decoder layer, while its keys and values come from the final encoder output, allowing every decoder position to attend to all input positions. The third sub-layer is the position-wise feed-forward network, applied independently at every decoder position.\n\nResidual connections surround all three sub-layers and are followed by layer normalization. With $d_{model}=512$ throughout the base model, each sub-layer returns a representation that can be added to its input. The masking, encoder connection, feed-forward transformation, residual addition, and normalization are repeated in every one of the six layers.\n\nAfter the final decoder layer, a learned linear transformation followed by softmax converts the decoder output to predicted next-token probabilities. The paper shares one weight matrix between the input embedding, output embedding, and pre-softmax linear transformation. The decoder stack therefore joins three kinds of information before prediction: previously known outputs through masked self-attention, the encoded input through encoder-decoder attention, and the position-wise transformation applied at each layer.\n\n<!-- grounded-in\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [3.3 Position-wise Feed-Forward Networks](../../source/03-model-architecture/03-03-position-wise-feed-forward-networks.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n- [3.5 Positional Encoding](../../source/03-model-architecture/03-05-positional-encoding.md)\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n-->\n","terms/core/encoder-decoder-attention":"\n## Encoder-Decoder Attention\n\nEncoder-decoder attention is the middle sub-layer in every Transformer decoder layer. It connects the two stacks by combining queries from the decoder with keys and values from the encoder. The paper calls the encoder keys and values “memory,” because they are taken from the complete output of the encoder stack and made available throughout decoding.\n\nMore precisely, the queries come from the preceding decoder layer, while the memory keys and values come from the encoder output. This lets every decoder position attend over every position in the input sequence. It differs from encoder self-attention, where queries, keys, and values all come from the encoder, and from masked decoder self-attention, where all three come from the decoder and future positions are blocked.\n\nThe Transformer implements this connection with multi-head attention. Each head separately projects the decoder queries and encoder keys and values, executes scaled dot-product attention, and produces a head output. The outputs are concatenated and projected back to $d_{model}$. In the base configuration, the same eight-head, $d_k=d_v=64$ construction is used for multi-head attention sub-layers.\n\nWithin each decoder layer, encoder-decoder attention follows masked decoder self-attention and precedes the position-wise feed-forward network. Its sub-layer is surrounded by a residual connection and followed by layer normalization. The operation retains the encoder-decoder attention role used in earlier sequence-to-sequence systems, but the Transformer places it inside an architecture without recurrent layers.\n\n<!-- grounded-in\n- [Abstract](../../source/abstract.md)\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n-->\n","terms/core/encoder-stack":"\n## Encoder Stack\n\nThe encoder stack maps an input sequence of symbol representations $(x_1,\\ldots,x_n)$ to continuous representations $\\mathbf{z}=(z_1,\\ldots,z_n)$. In the paper’s base Transformer, it consists of $N=6$ identical layers. The stack is the left half of the architecture diagram and produces the representation that every decoder layer can attend over.\n\nBefore the first encoder layer, input tokens are converted into learned embeddings of dimension $d_{model}$. The embedding weights are multiplied by $\\sqrt{d_{model}}$, and positional encodings of the same dimension are added so the model can use sequence order despite having neither recurrence nor convolution. Dropout is applied to the sum during training. The base configuration uses $d_{model}=512$.\n\nEvery encoder layer contains two sub-layers in a fixed order. Multi-head self-attention comes first: its queries, keys, and values all come from the output of the preceding encoder layer, allowing every position to attend to every encoder position. A position-wise feed-forward network comes second and applies the same two linear transformations with a ReLU independently at each position. Its input and output dimension is 512 and its inner dimension is $d_{ff}=2048$ in the base model.\n\nEach sub-layer is surrounded by a residual connection and followed by layer normalization, giving $LayerNorm(x+Sublayer(x))$. All sub-layers and embeddings produce the same $d_{model}$-dimensional representation so these residual additions are possible. The output of the sixth encoder layer becomes the memory used in encoder-decoder attention: each decoder layer takes its keys and values from this encoder output while supplying its own queries.\n\nThe appendix attention figures inspect heads from encoder self-attention in layer 5 of 6. They show attention from “making” across a distant dependency, sharp patterns from “its,” and different head patterns over the same sentence. These figures are examples of behavior inside the encoder stack rather than additional layers or separate processing stages.\n\n<!-- grounded-in\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [3.3 Position-wise Feed-Forward Networks](../../source/03-model-architecture/03-03-position-wise-feed-forward-networks.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n- [3.5 Positional Encoding](../../source/03-model-architecture/03-05-positional-encoding.md)\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n- [Attention Visualizations](../../source/attention-visualizations.md)\n-->\n","terms/core/masked-decoder-self-attention":"\n## Masked Decoder Self-Attention\n\nMasked decoder self-attention is the first sub-layer in every Transformer decoder layer. Like other self-attention, its queries, keys, and values all come from the same sequence representation. Unlike encoder self-attention, it does not permit every position to attend everywhere: a decoder position may attend only to positions up to and including itself.\n\nThe restriction preserves auto-regressive generation. The decoder produces one output symbol at a time, so the prediction for position $i$ must not depend on symbols at later positions. The paper combines two safeguards. Output embeddings are shifted one position to the right, and the self-attention computation blocks connections to subsequent positions. Together, these ensure that the prediction at position $i$ depends only on known outputs at positions less than $i$.\n\nThe mask is applied inside scaled dot-product attention before softmax. Values in the softmax input that correspond to illegal future connections are set to $-\\infty$. Those positions therefore cannot contribute to the weighted combination of values. The remaining allowed positions include the current position and all earlier decoder positions.\n\nAfter masked self-attention, the decoder layer performs encoder-decoder attention and then the position-wise feed-forward network. The first sub-layer models the permitted output-side context; the second uses queries from the decoder with keys and values from the encoder, bringing in the input sequence. Residual connections and layer normalization surround masked self-attention just as they surround the other decoder sub-layers.\n\n<!-- grounded-in\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n-->\n","terms/core/multi-head-attention":"\n## Multi-Head Attention\n\nMulti-head attention replaces one full-dimensional attention operation with several reduced-dimensional attention operations running in parallel. The Transformer linearly projects $Q$, $K$, and $V$ $h$ times using different learned parameters. Each projected triple passes through scaled dot-product attention and produces one head output. The head outputs are concatenated and passed through a final learned projection to return to the model dimension.\n\nThe paper defines $MultiHead(Q,K,V)=Concat(head_1,\\ldots,head_h)W^O$, with $head_i=Attention(QW_i^Q,KW_i^K,VW_i^V)$. The query and key projection matrices have shape $d_{model}\\times d_k$, the value projections have shape $d_{model}\\times d_v$, and $W^O$ has shape $hd_v\\times d_{model}$. In the base model, $h=8$ and $d_k=d_v=d_{model}/h=64$. Because each head uses a reduced dimension, the total computational cost remains similar to single-head attention operating at full dimensionality.\n\nThe motivation is to preserve multiple attention patterns rather than average them into one result. The paper states that several heads allow the model to attend jointly to information from different representation subspaces at different positions, while averaging within a single head inhibits this. In the background discussion, multi-head attention is also presented as the response to reduced effective resolution caused by averaging attention-weighted positions.\n\nThe same multi-head construction is used in three places with different sources for $Q$, $K$, and $V$. Encoder self-attention uses the preceding encoder layer for all three. Masked decoder self-attention uses the decoder representation and blocks future positions. Encoder-decoder attention uses decoder queries with encoder keys and values. Thus “multi-head” describes how attention is computed in parallel, while “self-attention,” “masked self-attention,” and “encoder-decoder attention” describe where the inputs come from and which connections are permitted.\n\nThe model-variation experiments vary the number of heads while keeping computation constant. Single-head attention records 24.9 development BLEU, 0.9 below the best listed value of 25.8. Four heads reach 25.5, sixteen heads also reach 25.8, and thirty-two heads fall to 25.4; the authors conclude that quality drops with both a single head and too many heads. Appendix visualizations provide qualitative evidence of head diversity: different heads attend across a long dependency, show sharp patterns around “its,” and produce different structures over the same sentence.\n\n<!-- grounded-in\n- [2 Background](../../source/02-background.md)\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2 Attention](../../source/03-model-architecture/03-02-attention/overview.md)\n- [3.2.2 Multi-Head Attention](../../source/03-model-architecture/03-02-attention/03-02-02-multi-head-attention.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [4 Why Self-Attention](../../source/04-why-self-attention.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n- [7 Conclusion](../../source/07-conclusion.md)\n- [Attention Visualizations](../../source/attention-visualizations.md)\n-->\n","terms/core/position-wise-feed-forward-network":"\n## Position-Wise Feed-Forward Network\n\nThe position-wise feed-forward network is the non-attention transformation present in every encoder and decoder layer. It is applied separately and identically to each sequence position. Within this sub-layer, information does not move between positions; interaction across positions has already occurred in the attention sub-layer.\n\nThe paper defines $FFN(x)=\\max(0,xW_1+b_1)W_2+b_2$. The first linear transformation maps the position representation into an inner dimension, $\\max(0,\\cdot)$ applies ReLU, and the second linear transformation maps it back to the model dimension. The same $W_1$, $b_1$, $W_2$, and $b_2$ are used at every position within one layer, but different Transformer layers have different feed-forward parameters. The paper also describes the operation as two convolutions with kernel size 1.\n\nIn the base model, the input and output dimension is $d_{model}=512$ and the inner dimension is $d_{ff}=2048$. Returning to $d_{model}$ allows the feed-forward output to be added to its sub-layer input through the residual connection before layer normalization. In an encoder layer, the feed-forward network follows multi-head self-attention. In a decoder layer, it follows both masked self-attention and encoder-decoder attention, making it the third and final sub-layer.\n\nThe paper’s efficiency comparison treats self-attention and the feed-forward network as complementary parts of a Transformer layer. It notes that even a separable convolution with kernel width equal to sequence length has complexity equal to the combination of one self-attention layer and one point-wise feed-forward layer. The model-variation table also changes $d_{ff}$ while retaining the base values elsewhere: reducing it to 1024 gives 25.4 development BLEU, while increasing it to 4096 gives 26.2, compared with 25.8 for the base $d_{ff}=2048$ configuration. These rows contribute to the authors’ broader observation that larger models perform better.\n\n<!-- grounded-in\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.3 Position-wise Feed-Forward Networks](../../source/03-model-architecture/03-03-position-wise-feed-forward-networks.md)\n- [4 Why Self-Attention](../../source/04-why-self-attention.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n-->\n","terms/core/positional-encoding":"\n## Positional Encoding\n\nPositional encoding supplies sequence-order information to the Transformer. Because the model contains neither recurrence nor convolution, position is not introduced through a recurrent step or a convolutional neighborhood. Instead, positional encodings are added to token embeddings at the bottoms of both the encoder and decoder stacks, giving the model information about relative or absolute token position.\n\nEach positional encoding has dimension $d_{model}$, exactly matching the learned token embedding, so the two vectors can be summed. In the embedding layers, the shared embedding weights are multiplied by $\\sqrt{d_{model}}$ before positional information is added. During training, dropout is applied to the embedding-plus-position sum in both stacks.\n\nThe reported Transformer uses a fixed sinusoidal construction. For position $pos$ and dimension index $i$, even dimensions use $PE_{(pos,2i)}=\\sin(pos/10000^{2i/d_{model}})$ and odd dimensions use $PE_{(pos,2i+1)}=\\cos(pos/10000^{2i/d_{model}})$. Each dimension is a sinusoid, and the wavelengths form a geometric progression from $2\\pi$ to $10000\\cdot2\\pi$. The paired sine and cosine values therefore create a full $d_{model}$-dimensional positional vector for every sequence position.\n\nThe authors chose this function because they hypothesized that it would make relative positions easy to learn: for any fixed offset $k$, $PE_{pos+k}$ can be represented as a linear function of $PE_{pos}$. They also experimented with learned positional embeddings. In the model-variation table, learned embeddings give development perplexity 4.92 and BLEU 25.7, nearly identical to the base sinusoidal model’s 4.92 and 25.8. The authors retained the sinusoidal version because it may allow extrapolation to sequence lengths longer than those encountered during training.\n\n<!-- grounded-in\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n- [3.5 Positional Encoding](../../source/03-model-architecture/03-05-positional-encoding.md)\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n-->\n","terms/core/query-key-value":"\n## Queries, Keys, and Values\n\nQueries, keys, and values are the three inputs through which the paper describes every attention operation. An attention function receives a query and a set of key-value pairs. It compares the query with each key to determine the weight assigned to the corresponding value, then returns a weighted sum of the values. The query, keys, values, and resulting output are all vectors.\n\nIn scaled dot-product attention, queries and keys have dimension $d_k$, while values have dimension $d_v$. The implementation processes sets of them simultaneously: queries are packed into a matrix $Q$, keys into $K$, and values into $V$. The compatibility matrix $QK^T$ contains query-key dot products. After division by $\\sqrt{d_k}$ and softmax, the resulting weights multiply $V$, giving $Attention(Q,K,V)=softmax(QK^T/\\sqrt{d_k})V$.\n\nMulti-head attention does not send the same full-dimensional matrices directly through every head. Head $i$ first computes $QW_i^Q$, $KW_i^K$, and $VW_i^V$ using separate learned projection matrices. The paper gives $W_i^Q$ and $W_i^K$ shapes of $d_{model}\\times d_k$, $W_i^V$ a shape of $d_{model}\\times d_v$, and uses $d_k=d_v=64$ for each of eight heads in the base model. This gives each head a different projected version of the queries, keys, and values before attention is computed.\n\nWhere $Q$, $K$, and $V$ come from determines which of the Transformer’s three attention applications is being performed. In encoder self-attention, all three come from the output of the preceding encoder layer, and every position can attend to every encoder position. In masked decoder self-attention, all three come from the decoder representation, but future connections are prohibited. In encoder-decoder attention, queries come from the preceding decoder layer while keys and values come from the encoder output, allowing each decoder position to attend over every input position.\n\n<!-- grounded-in\n- [3.2 Attention](../../source/03-model-architecture/03-02-attention/overview.md)\n- [3.2.1 Scaled Dot-Product Attention](../../source/03-model-architecture/03-02-attention/03-02-01-scaled-dot-product-attention.md)\n- [3.2.2 Multi-Head Attention](../../source/03-model-architecture/03-02-attention/03-02-02-multi-head-attention.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n-->\n","terms/core/scaled-dot-product-attention":"\n## Scaled Dot-Product Attention\n\nScaled dot-product attention is the specific attention function executed inside the Transformer’s attention heads. Its inputs are queries and keys of dimension $d_k$ and values of dimension $d_v$. For one query, the operation computes its dot product with every key, divides those compatibility scores by $\\sqrt{d_k}$, applies softmax to obtain weights, and returns the weighted combination of the values.\n\nThe paper evaluates many queries at once by packing them into a matrix $Q$, with keys in $K$ and values in $V$. The complete operation is $Attention(Q,K,V)=softmax(QK^T/\\sqrt{d_k})V$. Reading the expression from left to right, $QK^T$ creates the query-key score matrix, $1/\\sqrt{d_k}$ scales it, softmax converts it into weights, and multiplication by $V$ produces the attention outputs.\n\nThe scaling factor distinguishes the operation from ordinary dot-product attention. The authors suspect that, for large $d_k$, unscaled dot products grow in magnitude and push softmax into regions with extremely small gradients. Dividing by $\\sqrt{d_k}$ counters this effect. They report that additive and unscaled dot-product attention perform similarly for small $d_k$, while additive attention performs better at larger $d_k$ when the dot products are not scaled. Although additive and dot-product attention have similar theoretical complexity, the paper states that dot-product attention is faster and more space-efficient in practice because it can use optimized matrix multiplication.\n\nScaled dot-product attention also provides the point at which decoder masking is applied. Before softmax, scores for prohibited future connections are set to $-\\infty$. This prevents a decoder position from attending to later output positions and preserves the auto-regressive property. The unmasked core operation is otherwise the same across encoder self-attention, decoder self-attention, and encoder-decoder attention.\n\nThe model-variation results add evidence about the compatibility computation. Reducing attention key size $d_k$ from the base value of 64 to 32 or 16 lowers development BLEU from 25.8 to 25.4 or 25.1. The authors interpret this as suggesting that determining compatibility is not easy and that a more sophisticated compatibility function than dot product might be beneficial.\n\n<!-- grounded-in\n- [3.2 Attention](../../source/03-model-architecture/03-02-attention/overview.md)\n- [3.2.1 Scaled Dot-Product Attention](../../source/03-model-architecture/03-02-attention/03-02-01-scaled-dot-product-attention.md)\n- [3.2.2 Multi-Head Attention](../../source/03-model-architecture/03-02-attention/03-02-02-multi-head-attention.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n-->\n","terms/core/self-attention":"\n## Self-Attention\n\nSelf-attention, also called intra-attention, relates different positions of one sequence to compute a representation of that sequence. Its defining property in the Transformer is the source of its inputs: the queries, keys, and values all come from the same sequence representation. This differs from encoder-decoder attention, where decoder queries attend to keys and values produced by the encoder.\n\nThe encoder contains a self-attention sub-layer in every layer. All queries, keys, and values come from the output of the preceding encoder layer, so each encoder position can attend to every position in that representation. The decoder also contains self-attention, but it is masked: a decoder position may attend only to positions up to and including itself. The combination of masking and output embeddings shifted by one position ensures that a prediction cannot use future output symbols.\n\nSelf-attention is the architectural replacement for sequence-aligned recurrence and convolution. The paper evaluates this choice through per-layer complexity, parallelizability, and maximum path length between positions. A full self-attention layer has complexity $O(n^2d)$, requires $O(1)$ sequential operations, and gives any pair of positions an $O(1)$ maximum path. A recurrent layer has complexity $O(nd^2)$ but requires $O(n)$ sequential operations and has an $O(n)$ maximum path. The authors argue that shorter paths can make long-range dependencies easier to learn and that self-attention is faster than recurrence when $n<d$, which they state is usually true for the sentence representations used in the machine-translation systems discussed.\n\nCompared with convolution, full self-attention connects every pair of positions in one layer. A convolution with kernel width $k<n$ requires stacked layers to connect distant positions, producing longer paths. For very long sequences, the paper proposes restricting self-attention to a neighborhood of size $r$. This would lower complexity to $O(rnd)$ but increase maximum path length to $O(n/r)$; the authors present it as future work rather than part of the evaluated Transformer.\n\nThe paper also suggests a possible interpretability benefit. Attention visualizations from encoder layer 5 of 6 show heads connecting “making” with the distant phrase “more difficult,” heads described as apparently involved in anaphora resolution for “its,” and distinct patterns that seem related to sentence structure. These examples support the authors’ observation that different self-attention heads can learn different behaviors.\n\n<!-- grounded-in\n- [2 Background](../../source/02-background.md)\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n- [4 Why Self-Attention](../../source/04-why-self-attention.md)\n- [7 Conclusion](../../source/07-conclusion.md)\n- [Attention Visualizations](../../source/attention-visualizations.md)\n-->\n","terms/core/transformer":"\n## Transformer\n\nThe Transformer is the paper’s sequence transduction architecture based entirely on attention. It removes the sequence-aligned recurrent and convolutional layers used by earlier encoder-decoder systems while retaining the overall encoder-decoder organization. For an input sequence $(x_1,\\ldots,x_n)$, the encoder produces continuous representations $\\mathbf{z}=(z_1,\\ldots,z_n)$. The decoder then generates an output sequence $(y_1,\\ldots,y_m)$ one symbol at a time, consuming previously generated symbols when predicting the next.\n\nIn the base model, the encoder and decoder each contain $N=6$ layers and use $d_{model}=512$. Every encoder layer has multi-head self-attention followed by a position-wise feed-forward network. Every decoder layer has masked multi-head self-attention, multi-head encoder-decoder attention over the encoder output, and a position-wise feed-forward network. Residual connections surround every sub-layer and are followed by layer normalization. Masking and output embeddings shifted by one position prevent decoder predictions from using later output symbols.\n\nLearned input and output embeddings are combined with positional encodings because the architecture contains neither recurrence nor convolution to convey sequence order. The final decoder representation passes through a learned linear transformation and softmax to produce next-token probabilities. The same weight matrix is shared by the input embedding, output embedding, and pre-softmax transformation; embedding weights are multiplied by $\\sqrt{d_{model}}$.\n\nThe central design objective is to replace recurrently ordered computation with attention over positions. Self-attention connects all positions with $O(1)$ sequential operations and an $O(1)$ maximum path length, enabling substantially more parallelization than recurrence. Its per-layer complexity is $O(n^2d)$, and the paper states that it is faster than recurrence when sequence length $n$ is smaller than representation dimension $d$, as is commonly the case for the sentence representations considered. Multi-head attention counteracts the loss of effective resolution that can result from averaging attention-weighted positions.\n\nThe reported results connect this architecture to both efficiency and quality. The base translation models trained for 100,000 steps, about 12 hours on eight P100 GPUs, while the big models trained for 300,000 steps, about 3.5 days. Transformer (big) reaches 28.4 BLEU on WMT 2014 English-to-German, more than 2 BLEU above the previously reported results including ensembles, and the paper reports 41.8 BLEU for English-to-French in the abstract and comparison table. A four-layer Transformer also reaches 91.3 F1 with WSJ-only training and 92.7 F1 with semi-supervised training on English constituency parsing, supporting the authors’ claim that the architecture generalizes beyond translation.\n\n<!-- grounded-in\n- [Abstract](../../source/abstract.md)\n- [1 Introduction](../../source/01-introduction.md)\n- [2 Background](../../source/02-background.md)\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [3.3 Position-wise Feed-Forward Networks](../../source/03-model-architecture/03-03-position-wise-feed-forward-networks.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n- [3.5 Positional Encoding](../../source/03-model-architecture/03-05-positional-encoding.md)\n- [4 Why Self-Attention](../../source/04-why-self-attention.md)\n- [5.2 Hardware and Schedule](../../source/05-training/05-02-hardware-and-schedule.md)\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n- [6.1 Machine Translation](../../source/06-results/06-01-machine-translation.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n- [6.3 English Constituency Parsing](../../source/06-results/06-03-english-constituency-parsing.md)\n- [7 Conclusion](../../source/07-conclusion.md)\n-->\n","terms/prerequisites/adam-optimizer":"\n## Adam Optimizer\n\nAdam is a gradient-based optimization algorithm used to update a model’s learned parameters during training. For each parameter, it maintains moving estimates of the recent gradient and the recent squared gradient. These estimates adapt the update size to the history of that parameter rather than applying the same raw gradient scale everywhere.\n\nThe coefficients $\\beta_1$ and $\\beta_2$ control how quickly the first and second moving estimates change. The small constant $\\epsilon$ stabilizes the denominator in the adaptive update. A separate learning rate controls the overall step size, so selecting Adam does not by itself determine how the learning rate should change over the course of training.\n\nThe paper trains the Transformer with Adam using $\\beta_1=0.9$, $\\beta_2=0.98$, and $\\epsilon=10^{-9}$. It supplies a custom learning-rate schedule: $rate=d_{model}^{-0.5}\\min(step\\_num^{-0.5},step\\_num\\cdot warmup\\_steps^{-1.5})$. The rate is scaled by the inverse square root of the model dimension.\n\nWith $warmup\\_steps=4000$, the schedule increases linearly through the warmup period and then decreases in proportion to the inverse square root of the step number. This schedule is part of how Adam is used in the paper, not part of the general definition of Adam. The base Transformer trains for 100,000 steps, while the big configuration trains for 300,000 steps.\n\n<!-- grounded-in\n- [5.2 Hardware and Schedule](../../source/05-training/05-02-hardware-and-schedule.md)\n- [5.3 Optimizer](../../source/05-training/05-03-optimizer.md)\n-->\n","terms/prerequisites/autoregressive-generation":"\n## Autoregressive Generation\n\nAutoregressive generation constructs a sequence one element at a time. At position $i$, the model predicts the next symbol using the input and the output prefix that is already known. The sequence probability can be viewed as a product of conditional next-symbol probabilities, with each factor conditioned on positions before the current one. Generation continues by adding a selected symbol to the prefix and predicting again.\n\nThe Transformer decoder follows this pattern. It receives the encoder representation and previously produced output symbols, then its final linear transformation and softmax produce predicted next-token probabilities. Because later output symbols must not influence an earlier prediction, the decoder cannot use unrestricted self-attention over the entire target sequence.\n\nThe paper enforces this direction in two coordinated ways. Output embeddings are shifted one position to the right, and decoder self-attention masks subsequent positions. Inside scaled dot-product attention, scores for illegal future connections are set to $-\\infty$ before softmax. A position can therefore attend only to the output positions up to and including itself, ensuring that the prediction at position $i$ depends only on outputs before $i$.\n\nAt inference time, the next-symbol probabilities still leave a choice about which partial output to continue. The paper uses beam search rather than committing to only one candidate at each step. For translation it uses beam size 4, and for constituency parsing it uses beam size 21. Autoregression defines the dependency direction; beam search is the procedure used to explore possible sequences under those next-symbol predictions.\n\n<!-- grounded-in\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [6.1 Machine Translation](../../source/06-results/06-01-machine-translation.md)\n- [6.3 English Constituency Parsing](../../source/06-results/06-03-english-constituency-parsing.md)\n-->\n","terms/prerequisites/beam-search":"\n## Beam Search\n\nBeam search is an approximate procedure for decoding an autoregressive model. At each output step, the model assigns probabilities to possible next symbols for every retained partial sequence. Beam search expands those candidates and keeps only a fixed number of the most promising continuations. That number is the beam size.\n\nA beam of size 1 commits to one continuation at each step. A larger beam preserves several competing prefixes, but it still explores only a small subset of all possible output sequences. Search ends when candidates produce an end symbol or reach the allowed output length. The chosen final sequence depends on how candidate scores and lengths are compared.\n\nThe paper uses a length penalty controlled by $\\alpha$ when ranking translation and parsing candidates. For WMT machine translation, it uses beam size 4 and $\\alpha=0.6$. These values were selected on the development set. The maximum output length is input length plus 50, with early termination when possible.\n\nEnglish constituency parsing uses longer outputs and a different search setting. The paper raises the maximum to input length plus 300 and uses beam size 21 with $\\alpha=0.3$. The contrast illustrates that beam size, length penalty, and output-length limit are decoding choices adapted to the task; they do not change the Transformer’s learned encoder or decoder architecture.\n\n<!-- grounded-in\n- [6.1 Machine Translation](../../source/06-results/06-01-machine-translation.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n- [6.3 English Constituency Parsing](../../source/06-results/06-03-english-constituency-parsing.md)\n-->\n","terms/prerequisites/bleu":"\n## BLEU\n\nBLEU is an automatic metric for machine translation. It compares sequences of words or tokens in a generated translation with one or more reference translations, using matching n-grams together with a penalty for outputs that are too short. Higher BLEU indicates greater measured overlap under the metric; it is a comparison score, not a probability assigned by the model.\n\nBLEU can be used on a held-out development set to choose or compare configurations and on a test set to report final translation quality. Scores are meaningful only with their task, dataset, and evaluation setup. A difference within one reported benchmark is more informative than comparing numbers produced under unrelated conditions.\n\nThe paper uses BLEU as its main translation-quality measure. On WMT 2014 English-to-German newstest2014, Transformer (big) reaches 28.4 BLEU, more than 2 BLEU above the previously reported results including ensembles. The base model reaches 27.3, also above the earlier systems listed in the comparison table.\n\nFor WMT 2014 English-to-French, the results section states 41.0 for the big model, while the abstract and reproduced comparison table report 41.8. Keeping that source discrepancy visible is important when quoting the result. The model-variation experiments separately report development BLEU on English-to-German newstest2013, where the base configuration reaches 25.8 and the big configuration 26.4.\n\n<!-- grounded-in\n- [Abstract](../../source/abstract.md)\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n- [6.1 Machine Translation](../../source/06-results/06-01-machine-translation.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n-->\n","terms/prerequisites/convolutional-neural-network":"\n## Convolutional Neural Network\n\nA convolutional neural network applies learned operations across local neighborhoods of a sequence or other structured input. A kernel of width $k$ combines information from nearby positions. Because the same operation can be applied at many positions simultaneously, convolutional sequence models can compute hidden representations in parallel across positions.\n\nLocality creates a different limitation: one layer with $k<n$ does not directly connect every pair of sequence positions. Information from distant positions must pass through stacked convolutional layers. The paper distinguishes contiguous kernels, which require $O(n/k)$ layers to connect arbitrary positions, from dilated convolutions, which can reduce the longest path to $O(\\log_k(n))$.\n\nThe paper discusses Extended Neural GPU, ByteNet, and ConvS2S as convolutional approaches motivated partly by reducing sequential computation. Its comparison table assigns a standard convolutional layer complexity of $O(knd^2)$, $O(1)$ sequential operations, and a maximum path of $O(\\log_k(n))$ for the listed case. It states that convolutional layers are generally more expensive than recurrent layers by a factor of $k$.\n\nSeparable convolutions reduce the complexity to $O(knd+nd^2)$. Even when $k=n$, the paper says this complexity equals the combination of a self-attention layer and a position-wise feed-forward layer used by the Transformer. The Transformer therefore removes convolution as well as recurrence, using full self-attention to connect all positions in one layer with a constant maximum path length.\n\n<!-- grounded-in\n- [Abstract](../../source/abstract.md)\n- [2 Background](../../source/02-background.md)\n- [3.3 Position-wise Feed-Forward Networks](../../source/03-model-architecture/03-03-position-wise-feed-forward-networks.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n- [3.5 Positional Encoding](../../source/03-model-architecture/03-05-positional-encoding.md)\n- [4 Why Self-Attention](../../source/04-why-self-attention.md)\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n- [7 Conclusion](../../source/07-conclusion.md)\n-->\n","terms/prerequisites/dropout":"\n## Dropout\n\nDropout is a regularization method that randomly suppresses part of a neural network’s activations during training. The dropout probability controls how often elements are removed. Because the model cannot rely on every activation being present in every training pass, dropout is used to reduce overfitting to the training data.\n\nThe Transformer applies residual dropout to the output of every sub-layer. Dropout occurs before the sub-layer output is added to its input and before the combined result is normalized. This placement affects multi-head self-attention, encoder-decoder attention, and position-wise feed-forward sub-layers throughout the encoder and decoder.\n\nDropout is also applied to the sums of token embeddings and positional encodings at the bottoms of both stacks. The base model uses $P_{drop}=0.1$. The big English-to-German configuration uses 0.3, while the big English-to-French model described in the results section uses 0.1 instead.\n\nThe variation table shows the paper’s evidence for the regularizer. With the base configuration otherwise retained, setting dropout to 0 gives development perplexity 5.77 and BLEU 24.6. A rate of 0.2 gives perplexity 4.95 and BLEU 25.5, while the base rate of 0.1 gives 4.92 and 25.8. The authors summarize these comparisons by stating that dropout is very helpful in avoiding overfitting.\n\n<!-- grounded-in\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n- [6.1 Machine Translation](../../source/06-results/06-01-machine-translation.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n- [6.3 English Constituency Parsing](../../source/06-results/06-03-english-constituency-parsing.md)\n-->\n","terms/prerequisites/embedding":"\n## Token Embedding\n\nA token embedding converts a discrete vocabulary item into a continuous vector. A token begins as an identity—an index selecting one item from the vocabulary—while the embedding is a learned list of numerical features that neural-network layers can transform. Tokens using the same embedding table are represented in a common vector space with a fixed dimensionality.\n\nThe Transformer has learned embeddings for both input and output tokens. Each embedding has dimension $d_{model}$, which is 512 in the base model. This matches the dimension used by every sub-layer, allowing representations to move through attention, feed-forward, and residual operations without changing the outer width of the model.\n\nThe paper shares one weight matrix across the input embedding, output embedding, and learned linear transformation before the final softmax. In the embedding layers, those weights are multiplied by $\\sqrt{d_{model}}$. The final decoder transformation uses the shared weights to produce scores over possible next tokens before softmax converts them to probabilities.\n\nAn embedding alone identifies token content but does not supply sequence order to this non-recurrent, non-convolutional model. Positional encodings of the same $d_{model}$ dimension are added to the embeddings at the bottoms of the encoder and decoder stacks. During training, dropout is applied to these embedding-plus-position sums. The actual vocabulary items come from the paper’s subword tokenization: about 37,000 shared English-German tokens and 32,000 English-French word pieces.\n\n<!-- grounded-in\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n- [3.5 Positional Encoding](../../source/03-model-architecture/03-05-positional-encoding.md)\n- [5.1 Training Data and Batching](../../source/05-training/05-01-training-data-and-batching.md)\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n-->\n","terms/prerequisites/encoder-decoder-architecture":"\n## Encoder-Decoder Architecture\n\nAn encoder-decoder architecture divides a transduction model into two coordinated parts. The encoder reads the input sequence and converts it into an internal representation. The decoder uses that representation, together with the output symbols already available to it, to construct the output sequence. This separation allows input processing and output generation to use different internal operations while remaining connected through the encoder representation.\n\nThe paper writes the encoder mapping as $(x_1,\\ldots,x_n)\\rightarrow\\mathbf{z}=(z_1,\\ldots,z_n)$. Given $\\mathbf{z}$, the decoder produces $(y_1,\\ldots,y_m)$ one symbol at a time. Earlier competitive sequence transduction systems commonly used this overall structure with recurrent or convolutional layers and an attention mechanism connecting the two sides.\n\nThe Transformer preserves the division of responsibility but replaces the sequence layers. Its encoder is a stack of self-attention and position-wise feed-forward sub-layers. Its decoder contains masked self-attention and a feed-forward sub-layer, plus encoder-decoder attention that uses decoder queries with keys and values from the encoder output. That attention connection gives every decoder position access to all encoded input positions.\n\nFor a student, “encoder-decoder” describes the large-scale information flow, not a specific neural layer. Self-attention, multi-head attention, residual connections, positional encodings, and feed-forward networks describe how the Transformer implements the two sides. Autoregressive generation describes how the decoder uses the output prefix over time.\n\n<!-- grounded-in\n- [Abstract](../../source/abstract.md)\n- [1 Introduction](../../source/01-introduction.md)\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [7 Conclusion](../../source/07-conclusion.md)\n-->\n","terms/prerequisites/label-smoothing":"\n## Label Smoothing\n\nLabel smoothing is a training regularizer that replaces a fully certain target with a softened target distribution. Instead of placing all target probability on one class, it leaves most weight on the correct class and distributes a small amount elsewhere. The parameter $\\epsilon_{ls}$ controls how much smoothing is applied, discouraging the model from becoming maximally confident.\n\nThe Transformer base model uses label smoothing with $\\epsilon_{ls}=0.1$. The paper explicitly describes the tradeoff: smoothing makes the model more unsure, which hurts perplexity, but improves accuracy and BLEU. Perplexity and translation quality therefore need not move in the same direction under this regularizer.\n\nThe model-variation results make that tradeoff visible. With no label smoothing, the listed development perplexity is 4.67 and BLEU is 25.3. With $\\epsilon_{ls}=0.2$, perplexity worsens to 5.47 while BLEU reaches 25.7. The base value of 0.1 gives perplexity 4.92 and the best of these listed BLEU values, 25.8.\n\nLabel smoothing acts on the target probabilities used for training the output distribution. It is distinct from dropout, which randomly suppresses activations inside the network. The paper uses both: dropout is applied to sub-layer outputs and embedding-plus-position sums, while label smoothing changes the certainty of the training target presented to the decoder output.\n\n<!-- grounded-in\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n-->\n","terms/prerequisites/layer-normalization":"\n## Layer Normalization\n\nLayer normalization normalizes the features of a representation within an individual example. For one position’s feature vector, it uses that vector’s mean and variance to rescale the activations, followed by learned scale and shift parameters. Unlike a normalization based on statistics collected across a batch, the operation can be applied using the features available within that example.\n\nIn the Transformer, layer normalization is paired with residual connections. Every encoder and decoder sub-layer is surrounded by a residual path, and normalization is applied after the transformed output has been added back to the input. The paper writes the result as $\\mathrm{LayerNorm}(x+\\mathrm{Sublayer}(x))$.\n\nThe same pattern is repeated around all major sub-layers. Each encoder layer normalizes after multi-head self-attention and again after its position-wise feed-forward network. Each decoder layer also normalizes after masked self-attention, after encoder-decoder attention, and after its feed-forward network. With six layers in each stack, normalization occurs throughout the architecture rather than only at its input or output.\n\nIn the architecture figure, this ordering appears as “Add & Norm.” The residual addition combines the original and transformed representations, and layer normalization processes that combined result before it becomes the input to the next sub-layer. The paper uses this post-addition arrangement consistently across the model it describes.\n\n<!-- grounded-in\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n-->\n","terms/prerequisites/perplexity":"\n## Perplexity\n\nPerplexity summarizes how much probability a sequence model assigns to observed tokens. It is commonly expressed as the exponential of the average negative log-probability of the target sequence. Lower perplexity means the model assigns higher probability to the observed tokens on average under that particular evaluation and tokenization setup.\n\nThe unit being predicted matters. A per-wordpiece perplexity averages over word pieces, while a per-word perplexity averages over whole words. Changing the tokenization changes both the sequence and the prediction vocabulary, so the resulting numbers are not directly comparable. Perplexity should also be interpreted on held-out data rather than as a standalone description of translation quality.\n\nThe paper reports development-set perplexity in its Transformer variation table. The caption explicitly states that the values are per wordpiece under byte-pair encoding and must not be compared with per-word perplexities. The base configuration reports 4.92, while the big configuration reports 4.33.\n\nThe regularization results show why lower perplexity is not always aligned with higher BLEU. With no label smoothing, perplexity improves to 4.67 but BLEU is 25.3. The base smoothing value $\\epsilon_{ls}=0.1$ gives a worse perplexity of 4.92 but a higher BLEU of 25.8. The authors explain that label smoothing makes the model less certain, hurting perplexity while improving accuracy and BLEU.\n\n<!-- grounded-in\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n-->\n","terms/prerequisites/recurrent-neural-network":"\n## Recurrent Neural Network\n\nA recurrent neural network processes an ordered sequence through a chain of hidden states. At position $t$, it computes $h_t$ from the preceding state $h_{t-1}$ and the current input. Earlier information can affect later positions because it is carried through this state sequence. Long short-term memory and gated recurrent networks are recurrent variants named in the paper’s introduction.\n\nThe recurrence imposes an order on computation. State $h_t$ cannot be completed until $h_{t-1}$ is available, so positions within one training example cannot all be processed simultaneously. The paper identifies this inherently sequential structure as a fundamental limit on parallelization, especially for longer sequences where memory constraints also limit batching across examples.\n\nThe efficiency comparison expresses the same issue quantitatively. A recurrent layer has per-layer complexity $O(nd^2)$, requires $O(n)$ sequential operations, and has an $O(n)$ maximum path between distant positions. By comparison, a self-attention layer has complexity $O(n^2d)$ but requires $O(1)$ sequential operations and has an $O(1)$ maximum path. The authors state that self-attention is faster when sequence length $n$ is smaller than representation dimension $d$, which is commonly true for the sentence representations they discuss.\n\nThe Transformer’s defining change is to remove sequence-aligned recurrence from both its encoder and decoder representations. It retains autoregressive output generation—the decoder still predicts symbols one at a time—but the internal sequence layers are built from multi-head attention and position-wise feed-forward networks rather than recurrent hidden-state transitions.\n\n<!-- grounded-in\n- [Abstract](../../source/abstract.md)\n- [1 Introduction](../../source/01-introduction.md)\n- [2 Background](../../source/02-background.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n- [3.5 Positional Encoding](../../source/03-model-architecture/03-05-positional-encoding.md)\n- [4 Why Self-Attention](../../source/04-why-self-attention.md)\n- [6.3 English Constituency Parsing](../../source/06-results/06-03-english-constituency-parsing.md)\n- [7 Conclusion](../../source/07-conclusion.md)\n-->\n","terms/prerequisites/residual-connection":"\n## Residual Connection\n\nA residual connection adds a transformation’s input directly to its output. Instead of returning only $F(x)$, a residual sub-layer returns a representation based on $x+F(x)$. The unchanged input therefore has a direct route around the transformation while the sub-layer contributes an update to it. Addition requires the two representations to have the same shape.\n\nThe Transformer places a residual connection around every encoder and decoder sub-layer. If $\\mathrm{Sublayer}(x)$ denotes self-attention, encoder-decoder attention, or a position-wise feed-forward network, the paper writes the complete post-normalized result as $\\mathrm{LayerNorm}(x+\\mathrm{Sublayer}(x))$.\n\nConsistent dimensionality makes this pattern possible. Every embedding and sub-layer output has dimension $d_{model}=512$ in the base configuration. Multi-head attention concatenates its heads and projects the result back to $d_{model}$; the feed-forward network expands to $d_{ff}=2048$ internally but returns to $d_{model}$. Each result can therefore be added to the sub-layer input.\n\nRegularization changes the order slightly without removing the connection. The paper applies dropout to each sub-layer output before it is added to the input and normalized. In the architecture diagram, the looping arrows around attention and feed-forward blocks depict these residual paths, while the “Add & Norm” blocks depict the addition followed by layer normalization.\n\n<!-- grounded-in\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.1 Encoder and Decoder Stacks](../../source/03-model-architecture/03-01-encoder-decoder-stacks.md)\n- [5.4 Regularization](../../source/05-training/05-04-regularization.md)\n-->\n","terms/prerequisites/sequence-transduction":"\n## Sequence Transduction\n\nSequence transduction is the problem of converting one sequence into another. An input consists of ordered symbols $(x_1,\\ldots,x_n)$, and the desired output is another ordered sequence $(y_1,\\ldots,y_m)$. The two sequences may contain different kinds of symbols and need not have the same length. A transduction model must therefore represent the input, preserve relevant relationships within it, and produce an output whose content and order depend on that input.\n\nMachine translation is the paper’s main example: an input sentence in one language is transformed into an output sentence in another. English constituency parsing is the second example. The paper notes that parsing outputs are subject to strong stru
