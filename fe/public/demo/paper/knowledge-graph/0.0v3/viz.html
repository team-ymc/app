ctural constraints and are significantly longer than their input sentences, making it a useful test of whether the architecture transfers beyond translation.\n\nThe Transformer implements sequence transduction with an encoder-decoder architecture. Its encoder maps $(x_1,\\ldots,x_n)$ to continuous representations $\\mathbf{z}=(z_1,\\ldots,z_n)$. Given $\\mathbf{z}$, the decoder generates $(y_1,\\ldots,y_m)$ one element at a time and consumes earlier generated symbols when predicting the next. Attention provides the connections within the input representation, within the known output prefix, and from the decoder back to the encoded input.\n\nThe paper’s central claim is not that sequence transduction itself is new, but that it can be performed without the recurrent or convolutional sequence layers dominant in earlier systems. The Transformer is presented as the first transduction model to compute its input and output representations entirely with self-attention, and its translation and parsing experiments test that design on different sequence-to-sequence problems.\n\n<!-- grounded-in\n- [Abstract](../../source/abstract.md)\n- [1 Introduction](../../source/01-introduction.md)\n- [2 Background](../../source/02-background.md)\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n- [4 Why Self-Attention](../../source/04-why-self-attention.md)\n- [6.1 Machine Translation](../../source/06-results/06-01-machine-translation.md)\n- [6.3 English Constituency Parsing](../../source/06-results/06-03-english-constituency-parsing.md)\n- [7 Conclusion](../../source/07-conclusion.md)\n-->\n","terms/prerequisites/softmax":"\n## Softmax\n\nSoftmax converts a vector of real-valued scores into non-negative values that sum to one. For scores $s_1,\\ldots,s_m$, each output is $\\exp(s_j)/\\sum_l\\exp(s_l)$. Larger input scores receive larger shares of the total, so the outputs can be interpreted as a distribution of relative weights or probabilities rather than unbounded raw scores.\n\nThe Transformer uses softmax inside attention. The query-key matrix $QK^T$ contains compatibility scores. After division by $\\sqrt{d_k}$, softmax turns each query’s scores into weights over the values, and multiplication by $V$ produces their weighted combination. The scale matters because the authors suspect that large dot products can push softmax into regions with extremely small gradients.\n\nDecoder masking also operates at the softmax input. Scores for prohibited future connections are set to $-\\infty$ before softmax. Their resulting weight is zero, so a decoder position cannot use later output positions. The remaining permitted scores are normalized together.\n\nSoftmax appears a second time at the output of the decoder. A learned linear transformation produces a score for every possible next token, and softmax converts those scores into predicted next-token probabilities. The model shares the pre-softmax weight matrix with the input and output embedding matrices. Attention softmax distributes weight across sequence positions; output softmax distributes probability across vocabulary items.\n\n<!-- grounded-in\n- [3 Model Architecture](../../source/03-model-architecture/overview.md)\n- [3.2.1 Scaled Dot-Product Attention](../../source/03-model-architecture/03-02-attention/03-02-01-scaled-dot-product-attention.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [3.4 Embeddings and Softmax](../../source/03-model-architecture/03-04-embeddings-and-softmax.md)\n-->\n","terms/prerequisites/dot-product":"\n## Dot Product\n\nThe dot product combines two vectors of the same length by multiplying corresponding components and summing the results: $q\\cdot k=\\sum_j q_jk_j$. It produces one scalar from two vectors. In attention, that scalar is used as a compatibility score between a query $q$ and a key $k$; different keys give different scores for the same query.\n\nThe Transformer computes many dot products at once with matrix multiplication. If queries are rows of $Q$ and keys are rows of $K$, then $QK^T$ contains the dot product of every query with every key. Transposing $K$ aligns each query row with each key row. Softmax is later applied across these scores, and the resulting weights combine the value matrix $V$.\n\nThe paper’s “scaled dot-product” operation divides every score by $\\sqrt{d_k}$, where $d_k$ is the query and key dimension. The authors suspect that unscaled dot products grow large in magnitude when $d_k$ is large, pushing softmax into regions with extremely small gradients. Scaling counteracts that effect. The complete operation is $Attention(Q,K,V)=softmax(QK^T/\\sqrt{d_k})V$.\n\nThe paper contrasts dot-product attention with additive attention, which computes compatibility through a feed-forward network. It states that the two have similar theoretical complexity, but dot products are faster and more space-efficient in practice because they can use optimized matrix multiplication. In the model variations, reducing $d_k$ from 64 to 32 or 16 lowers development BLEU, which the authors interpret as evidence that determining compatibility is not easy.\n\n<!-- grounded-in\n- [3.2 Attention](../../source/03-model-architecture/03-02-attention/overview.md)\n- [3.2.1 Scaled Dot-Product Attention](../../source/03-model-architecture/03-02-attention/03-02-01-scaled-dot-product-attention.md)\n- [3.2.2 Multi-Head Attention](../../source/03-model-architecture/03-02-attention/03-02-02-multi-head-attention.md)\n- [3.2.3 Applications of Attention in our Model](../../source/03-model-architecture/03-02-attention/03-02-03-applications.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n-->\n","terms/prerequisites/subword-tokenization":"\n## Subword Tokenization\n\nSubword tokenization represents text using units that may be complete words or smaller pieces of words. A fixed vocabulary contains the available pieces, and a sentence is converted into a sequence of their token identifiers before it reaches the embedding layer. This allows a model to use a limited vocabulary while still composing words that are not stored as single vocabulary entries.\n\nThe paper uses two subword schemes. Its WMT 2014 English-German data contains about 4.5 million sentence pairs and is encoded with byte-pair encoding using a shared source-target vocabulary of about 37,000 tokens. Its larger English-French data contains 36 million sentence pairs and uses a 32,000 word-piece vocabulary.\n\nTokenization affects the sequence length $n$ seen by the Transformer and determines which discrete items receive learned embeddings. The paper batches sentence pairs by approximate sequence length, with about 25,000 source tokens and 25,000 target tokens per training batch. These token counts refer to the produced subword units rather than necessarily to space-separated words.\n\nTokenization also matters when interpreting evaluation values. The model-variation table reports perplexities per wordpiece under the paper’s byte-pair encoding and explicitly warns that they should not be compared with per-word perplexities. BLEU is reported for the final translations, while perplexity depends directly on the token sequence over which next-token probabilities are evaluated.\n\n<!-- grounded-in\n- [4 Why Self-Attention](../../source/04-why-self-attention.md)\n- [5.1 Training Data and Batching](../../source/05-training/05-01-training-data-and-batching.md)\n- [6.2 Model Variations](../../source/06-results/06-02-model-variations.md)\n-->\n","terms/prerequisites/f1-score":"\n## F1 Score\n\nF1 combines precision and recall into one evaluation score. Precision measures how many predicted items are correct, while recall measures how many reference items were recovered. Their harmonic mean is $F1=2\\cdot precision\\cdot recall/(precision+recall)$. A high F1 requires both measures to be high rather than allowing one to compensate completely for the other.\n\nIn constituency parsing, F1 evaluates the constituents predicted for a sentence against the reference parse. The paper reports results on Section 23 of the Wall Street Journal portion of the Penn Treebank and places the score beside each parser’s training regime, because systems trained with WSJ data alone, semi-supervised data, multi-task learning, or generative objectives use different amounts and kinds of supervision.\n\nThe four-layer Transformer reaches 91.3 F1 with WSJ-only discriminative training on about 40,000 sentences. This exceeds the listed Petrov et al. and Zhu et al. WSJ-only results of 90.4 and is below the listed Dyer et al. result of 91.7. With semi-supervised training on corpora totaling approximately 17 million sentences, the Transformer reaches 92.7, above the other semi-supervised results shown, which range from 91.3 to 92.1.\n\nThe remaining table entries include 93.0 for a multi-task system and 93.3 for a generative system. The paper uses the Transformer results to argue that the architecture generalizes beyond translation, including to parsing outputs that have strong structural constraints and are significantly longer than their inputs.\n\n<!-- grounded-in\n- [6.3 English Constituency Parsing](../../source/06-results/06-03-english-constituency-parsing.md)\n-->\n"},"types":["Core Term","Formula","Image","Paper Section","Prerequisite Term","Table"],"palette":{"BigQuery Dataset":"#8b5cf6","BigQuery Table":"#3b82f6","Reference":"#10b981"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  const typePalette = {
    "Paper Section": { color: "#3158d4", tint: "#eef2ff", label: "Sections" },
    "Core Term": { color: "#0f766e", tint: "#ecfdf5", label: "Core terms" },
    "Prerequisite Term": { color: "#475569", tint: "#f1f5f9", label: "Prerequisites" },
    Image: { color: "#7c3aed", tint: "#f5f3ff", label: "Images" },
    Table: { color: "#047857", tint: "#ecfdf5", label: "Tables" },
    Formula: { color: "#c2410c", tint: "#fff7ed", label: "Formulas" },
  };
  const typeFilters = document.getElementById("type-filters");
  let activeTypeFilter = "";
  const filterTypeOrder = [
    "Paper Section",
    "Core Term",
    "Prerequisite Term",
    "Image",
    "Table",
    "Formula",
  ].filter((type) => bundle.types.includes(type));
  const filterOptions = [
    { type: "", color: "#64748b", tint: "#f1f5f9", label: "All" },
    ...filterTypeOrder.map((type) => ({ type, ...typePalette[type] })),
  ];
  for (const option of filterOptions) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = `type-filter${option.type ? "" : " active"}`;
    button.dataset.type = option.type;
    button.textContent = option.label || option.type;
    button.style.setProperty("--type-color", option.color);
    button.style.setProperty("--type-tint", option.tint);
    button.setAttribute("aria-pressed", String(!option.type));
    button.addEventListener("click", () => applyTypeFilter(option.type));
    typeFilters.appendChild(button);
  }

  // Read the bundle's invisible relationship blocks so the viewer can
  // distinguish reading order from document hierarchy.
  function resolveConceptLink(sourceId, href) {
    const resolved = sourceId.split("/");
    resolved.pop();
    const cleanHref = href.replace(/#.*$/, "").replace(/\.md$/, "");
    for (const segment of cleanHref.split("/")) {
      if (!segment || segment === ".") continue;
      if (segment === "..") resolved.pop();
      else resolved.push(segment);
    }
    return resolved.join("/");
  }

  const relationshipSets = {
    "followed-by": new Set(),
    subsections: new Set(),
    "cited-in": new Set(),
    "grounded-in": new Set(),
  };
  const followedNext = new Map();
  const followedPrevious = new Map();
  const subsectionChildren = new Map();
  const subsectionParent = new Map();
  const citedSectionTarget = new Map();

  function readRelationshipBlocks(name) {
    for (const [source, body] of Object.entries(bundle.bodies || {})) {
      const blockPattern = new RegExp(`<!--\\s*${name}\\s*([\\s\\S]*?)-->`, "g");
      let blockMatch;
      while ((blockMatch = blockPattern.exec(body)) !== null) {
        const linkPattern = /\]\(([^)\s]+\.md(?:#[^)\s]*)?)\)/g;
        let linkMatch;
        while ((linkMatch = linkPattern.exec(blockMatch[1])) !== null) {
          const target = resolveConceptLink(source, linkMatch[1]);
          const pair = `${source}\u0000${target}`;
          relationshipSets[name].add(pair);
          if (name === "followed-by" && !followedNext.has(source)) {
            followedNext.set(source, target);
            if (!followedPrevious.has(target)) followedPrevious.set(target, source);
          }
          if (name === "subsections") {
            if (!subsectionChildren.has(source)) subsectionChildren.set(source, []);
            subsectionChildren.get(source).push(target);
            subsectionParent.set(target, source);
          }
          if (name === "cited-in") citedSectionTarget.set(source, target);
        }
      }
    }
  }

  readRelationshipBlocks("followed-by");
  readRelationshipBlocks("subsections");
  readRelationshipBlocks("cited-in");
  readRelationshipBlocks("grounded-in");

  // Preserve every discovered edge, but split dual-purpose links so their two
  // meanings remain visible instead of being flattened into a single arrow.
  const graphEdges = [];
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    const pair = `${source}\u0000${target}`;
    const relations = [];
    if (relationshipSets["followed-by"].has(pair)) relations.push("followed-by");
    if (relationshipSets.subsections.has(pair)) relations.push("subsections");
    if (relationshipSets["cited-in"].has(pair)) relations.push("cited-in");
    if (relationshipSets["grounded-in"].has(pair)) relations.push("grounded-in");
    if (!relations.length) relations.push("related");
    for (const relation of relations) {
      graphEdges.push({
        data: {
          ...edge.data,
          id: `${edge.data.id}__${relation}`,
          relation,
        },
      });
    }
  }

  function nodeDepth(id) {
    let depth = 0;
    let current = id;
    const seen = new Set();
    while (subsectionParent.has(current) && !seen.has(current)) {
      seen.add(current);
      current = subsectionParent.get(current);
      depth += 1;
    }
    return depth;
  }

  for (const node of bundle.nodes) {
    node.data.depth = nodeDepth(node.data.id);
    if (typePalette[node.data.type]) node.data.color = typePalette[node.data.type].color;
  }

  // Follow the paper's explicit reading sequence and keep only top-level
  // concepts for the horizontal spine.
  const nodeTypes = new Map(bundle.nodes.map((node) => [node.data.id, node.data.type]));
  const followedTargets = new Set(followedNext.values());
  const roots = bundle.nodes
    .map((node) => node.data.id)
    .filter((id) => nodeTypes.get(id) === "Paper Section" && nodeDepth(id) === 0);
  const sequenceStart =
    roots.find((id) => followedNext.has(id) && !followedTargets.has(id)) || roots[0];
  const topLevelOrder = [];
  const visitedSequence = new Set();
  let sequenceCursor = sequenceStart;
  while (sequenceCursor && !visitedSequence.has(sequenceCursor)) {
    visitedSequence.add(sequenceCursor);
    if (nodeDepth(sequenceCursor) === 0) topLevelOrder.push(sequenceCursor);
    sequenceCursor = followedNext.get(sequenceCursor);
  }
  for (const root of roots) {
    if (!topLevelOrder.includes(root)) topLevelOrder.push(root);
  }

  const paperPositions = {};
  const rootGap = 400;
  const childGap = 220;
  const nestedIndent = 88;
  const rootY = 180;
  const firstChildY = 420;

  function placeChildren(parentId, rootX, cursorY, depth) {
    for (const childId of subsectionChildren.get(parentId) || []) {
      paperPositions[childId] = {
        x: rootX + Math.max(0, depth - 1) * nestedIndent,
        y: cursorY,
      };
      cursorY += childGap;
      cursorY = placeChildren(childId, rootX, cursorY, depth + 1);
    }
    return cursorY;
  }

  topLevelOrder.forEach((id, index) => {
    const x = 160 + index * rootGap;
    paperPositions[id] = { x, y: rootY };
    placeChildren(id, x, firstChildY, 1);
  });

  // Place extracted resources near the paper section that cites them. Resources
  // cited by top-level sections form a vertical lane; subsection resources sit in
  // the quieter neighboring lane so they do not overlap the reading order.
  const assetsBySection = new Map();
  for (const [assetId, sectionId] of citedSectionTarget.entries()) {
    if (!assetsBySection.has(sectionId)) assetsBySection.set(sectionId, []);
    assetsBySection.get(sectionId).push(assetId);
  }

  function topLevelAncestor(id) {
    let current = id;
    while (subsectionParent.has(current)) current = subsectionParent.get(current);
    return current;
  }

  const topLevelIndex = new Map(topLevelOrder.map((id, index) => [id, index]));
  for (const [sourceId, assetIds] of assetsBySection.entries()) {
    const sourcePosition = paperPositions[sourceId];
    if (!sourcePosition) continue;
    const sourceHasChildren = (subsectionChildren.get(sourceId) || []).length > 0;
    const sourceIsTopLevel = nodeDepth(sourceId) === 0;

    if (sourceIsTopLevel && sourceHasChildren) {
      assetIds.forEach((assetId, index) => {
        paperPositions[assetId] = {
          x: sourcePosition.x + (index - (assetIds.length - 1) / 2) * 350,
          y: sourcePosition.y - 165,
        };
      });
      continue;
    }

    if (sourceIsTopLevel) {
      const sourceIndex = topLevelIndex.get(sourceId) ?? 0;
      const previousRoot = topLevelOrder[sourceIndex - 1];
      const previousHasChildren = (subsectionChildren.get(previousRoot) || []).length > 0;
      assetIds.forEach((assetId, index) => {
        paperPositions[assetId] = {
          x: sourcePosition.x +
            (previousHasChildren ? (index - (assetIds.length - 1) / 2) * 350 : 0),
          y: previousHasChildren
            ? sourcePosition.y - 165
            : sourcePosition.y + 230 + index * childGap,
        };
      });
      continue;
    }

    const ancestorId = topLevelAncestor(sourceId);
    const ancestorIndex = topLevelIndex.get(ancestorId) ?? 0;
    const previousRoot = topLevelOrder[ancestorIndex - 1];
    const nextRoot = topLevelOrder[ancestorIndex + 1];
    const previousBusy = (subsectionChildren.get(previousRoot) || []).length > 0;
    const nextBusy = (subsectionChildren.get(nextRoot) || []).length > 0;
    // At either end of the paper spine, keep resources on the open outer side.
    // Between roots, prefer the quieter neighboring lane.
    const direction = !previousRoot
      ? -1
      : !nextRoot
        ? 1
        : nextBusy && !previousBusy
          ? -1
          : previousBusy && !nextBusy
            ? 1
            : -1;
    // Multiple resources from one subsection fan outward in a horizontal lane.
    // This keeps them clear of resources belonging to the rows immediately
    // above and below the cited subsection.
    assetIds.forEach((assetId, index) => {
      paperPositions[assetId] = {
        x: sourcePosition.x + direction * (360 + index * 350),
        y: sourcePosition.y,
      };
    });
  }

  // Keep terminology readable as two centered vocabulary bands below the
  // complete paper/resource map. Computing their vertical position prevents
  // a deep section hierarchy from ever running into the term nodes.
  const paperMapPositions = Object.entries(paperPositions)
    .filter(([id]) => !["Core Term", "Prerequisite Term"].includes(nodeTypes.get(id)));
  const paperMapCenterX = paperMapPositions.length
    ? (Math.min(...paperMapPositions.map(([, position]) => position.x)) +
        Math.max(...paperMapPositions.map(([, position]) => position.x))) / 2
    : 160;
  const paperMapBottomY = paperMapPositions.length
    ? Math.max(...paperMapPositions.map(([, position]) => position.y))
    : firstChildY;
  const termColumns = 5;
  const termColumnGap = 360;
  const termRowGap = 185;
  const bandGap = 360;

  function placeTermBand(type, startY) {
    const terms = bundle.nodes
      .filter((node) => node.data.type === type)
      .sort((a, b) => a.data.label.localeCompare(b.data.label));
    const columns = Math.min(termColumns, Math.max(terms.length, 1));
    const startX = paperMapCenterX - ((columns - 1) * termColumnGap) / 2;
    terms.forEach((node, index) => {
      paperPositions[node.data.id] = {
        x: startX + (index % columns) * termColumnGap,
        y: startY + Math.floor(index / columns) * termRowGap,
      };
    });
    const rows = Math.max(1, Math.ceil(terms.length / columns));
    return startY + (rows - 1) * termRowGap;
  }

  const coreBandStartY = paperMapBottomY + bandGap;
  const coreBandEndY = placeTermBand("Core Term", coreBandStartY);
  const prerequisiteBandStartY = coreBandEndY + bandGap;
  const prerequisiteBandEndY = placeTermBand("Prerequisite Term", prerequisiteBandStartY);

  // A defensive fallback keeps future, unlinked concepts visible.
  let fallbackIndex = 0;
  for (const node of bundle.nodes) {
    if (paperPositions[node.data.id]) continue;
    paperPositions[node.data.id] = {
      x: paperMapCenterX - 2 * termColumnGap + (fallbackIndex % termColumns) * termColumnGap,
      y: prerequisiteBandEndY + bandGap + Math.floor(fallbackIndex / termColumns) * termRowGap,
    };
    fallbackIndex += 1;
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...graphEdges],
    style: [
      {
        selector: "node",
        style: {
          "shape": "round-rectangle",
          "background-color": "#ffffff",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 18,
          "font-weight": 700,
          "line-height": 1.18,
          "text-valign": "center",
          "text-halign": "center",
          "text-wrap": "wrap",
          "text-max-width": 240,
          "width": 270,
          "height": 92,
          "border-width": 2,
          "border-color": "#3b82f6",
        },
      },
      {
        selector: "node[depth = 0]",
        style: {
          "background-color": "#1d4ed8",
          "border-color": "#1e40af",
          "color": "#ffffff",
          "font-weight": 700,
          "width": 286,
          "height": 98,
        },
      },
      {
        selector: "node[depth = 2]",
        style: {
          "background-color": "#ffffff",
          "border-color": "#64748b",
          "border-style": "dashed",
          "width": 264,
          "height": 88,
        },
      },
      {
        selector: 'node[type = "Image"]',
        style: {
          "background-color": "#7c3aed",
          "border-color": "#5b21b6",
          "border-style": "solid",
          "color": "#ffffff",
          "font-weight": 700,
          "font-size": 18,
          "text-max-width": 274,
          "width": 304,
          "height": 108,
        },
      },
      {
        selector: 'node[type = "Table"]',
        style: {
          "background-color": "#047857",
          "border-color": "#065f46",
          "border-style": "solid",
          "color": "#ffffff",
          "font-weight": 700,
          "font-size": 18,
          "text-max-width": 274,
          "width": 304,
          "height": 108,
        },
      },
      {
        selector: 'node[type = "Formula"]',
        style: {
          "background-color": "#c2410c",
          "border-color": "#9a3412",
          "border-style": "solid",
          "color": "#ffffff",
          "font-weight": 700,
          "font-size": 18,
          "text-max-width": 274,
          "width": 304,
          "height": 108,
        },
      },
      {
        selector: 'node[type = "Core Term"]',
        style: {
          "background-color": "#0f766e",
          "border-color": "#115e59",
          "border-style": "solid",
          "color": "#ffffff",
          "font-weight": 700,
          "font-size": 18,
          "text-max-width": 248,
          "width": 278,
          "height": 94,
        },
      },
      {
        selector: 'node[type = "Prerequisite Term"]',
        style: {
          "background-color": "#475569",
          "border-color": "#334155",
          "border-style": "solid",
          "color": "#ffffff",
          "font-weight": 700,
          "font-size": 18,
          "text-max-width": 248,
          "width": 278,
          "height": 94,
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 4,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "node.type-focus",
        style: {
          "border-width": 3,
          "z-index": 15,
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.4,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "unbundled-bezier",
          "control-point-weights": 0.5,
          "arrow-scale": 0.9,
        },
      },
      {
        selector: 'edge[relation = "followed-by"]',
        style: {
          "width": 2.2,
          "line-color": "#2563eb",
          "target-arrow-color": "#2563eb",
          "line-style": "solid",
          "control-point-distances": -18,
        },
      },
      {
        selector: 'edge[relation = "subsections"]',
        style: {
          "width": 1.6,
          "line-color": "#94a3b8",
          "target-arrow-color": "#94a3b8",
          "line-style": "dashed",
          "control-point-distances": 18,
        },
      },
      {
        selector: 'edge[relation = "cited-in"]',
        style: {
          "width": 1.8,
          "line-color": "#7c3aed",
          "target-arrow-color": "#7c3aed",
          "line-style": "dotted",
          "control-point-distances": 0,
        },
      },
      {
        selector: 'edge[relation = "grounded-in"]',
        style: {
          "width": 1,
          "line-color": "#0891b2",
          "target-arrow-color": "#0891b2",
          "line-style": "dashed",
          "opacity": 0.08,
          "control-point-distances": 0,
        },
      },
      {
        selector: 'edge.relationship-focus',
        style: {
          "width": 2,
          "opacity": 0.9,
          "z-index": 20,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.07 },
      },
    ],
    layout: {
      name: "preset",
      positions: (node) => paperPositions[node.id()],
      fit: false,
      animate: false,
      padding: 80,
    },
    ready: function () {
      const zoom = Math.min(0.82, Math.max(0.64, 0.82 * (this.width() / 1280)));
      this.viewport({
        zoom,
        pan: { x: 24, y: 24 },
      });
    },
  });

  function focusPaperMap(animate = false) {
    const zoom = Math.min(0.82, Math.max(0.64, 0.82 * (cy.width() / 1280)));
    const viewport = {
      zoom,
      pan: { x: 24, y: 24 },
    };
    if (animate) cy.animate(viewport, { duration: 420 });
    else cy.viewport(viewport);
  }

  function focusTypeNodes(type) {
    if (type === "Paper Section") {
      focusPaperMap(true);
      return;
    }
    const nodes = cy.nodes().filter((node) => node.data("type") === type);
    if (!nodes.length) return;

    const bounds = nodes.boundingBox({ includeLabels: true, includeOverlays: false });
    const padding = 88;
    const availableWidth = Math.max(1, cy.width() - padding * 2);
    const availableHeight = Math.max(1, cy.height() - padding * 2);
    const fitZoom = Math.min(availableWidth / Math.max(bounds.w, 1), availableHeight / Math.max(bounds.h, 1));
    const minimumZoom = type === "Paper Section" ? 0.68 : 0.82;
    const zoom = Math.min(1.08, Math.max(minimumZoom, fitZoom));
    const centerX = bounds.x1 + bounds.w / 2;
    const centerY = bounds.y1 + bounds.h / 2;
    const pan = {
      x: cy.width() / 2 - centerX * zoom,
      y: cy.height() / 2 - centerY * zoom,
    };
    cy.animate({ zoom, pan }, { duration: 440 });
  }

  function restoreFilterViewport() {
    const activeLayout = document.getElementById("layout").value;
    if (activeLayout === "paper-map") focusPaperMap(true);
    else cy.animate({ fit: { eles: cy.elements(), padding: 70 } }, { duration: 420 });
  }

  function layoutOptions(name) {
    if (name === "paper-map") {
      return {
        name: "preset",
        positions: (node) => paperPositions[node.id()],
        fit: false,
        animate: false,
        padding: 80,
      };
    }
    if (name === "cose") {
      return {
        name: "cose",
        animate: false,
        fit: true,
        padding: 90,
        idealEdgeLength: 220,
        nodeRepulsion: 20000,
        nodeOverlap: 80,
        componentSpacing: 220,
        gravity: 0.1,
        numIter: 1500,
        nodeDimensionsIncludeLabels: true,
      };
    }
    if (name === "breadthfirst") {
      return {
        name: "breadthfirst",
        directed: true,
        spacingFactor: 1.9,
        avoidOverlap: true,
        nodeDimensionsIncludeLabels: true,
        animate: false,
        padding: 90,
      };
    }
    if (name === "concentric") {
      return {
        name: "concentric",
        animate: false,
        fit: true,
        avoidOverlap: true,
        minNodeSpacing: 55,
        spacingFactor: 1.75,
        padding: 90,
      };
    }
    if (name === "grid") {
      return {
        name: "grid",
        animate: false,
        fit: true,
        avoidOverlap: true,
        avoidOverlapPadding: 50,
        condense: false,
        padding: 90,
      };
    }
    return {
      name,
      animate: false,
      fit: true,
      avoidOverlap: true,
      spacingFactor: 1.7,
      padding: 90,
    };
  }

  function runLayout(name) {
    cy.layout(layoutOptions(name)).run();
    if (activeTypeFilter) requestAnimationFrame(() => focusTypeNodes(activeTypeFilter));
    else if (name === "paper-map") requestAnimationFrame(() => focusPaperMap());
  }

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    runLayout(e.target.value);
  });

  document.getElementById("reset").addEventListener("click", () => {
    clearSelection();
    applyTypeFilter("");
  });

  const graphWorkspace = document.querySelector(".graph-workspace");
  const sidebarToggle = document.getElementById("sidebar-toggle");
  sidebarToggle.addEventListener("click", () => {
    const isCollapsed = graphWorkspace.classList.toggle("sidebar-collapsed");
    sidebarToggle.setAttribute("aria-expanded", String(!isCollapsed));
    sidebarToggle.setAttribute("aria-label", isCollapsed ? "그래프 제어 패널 열기" : "그래프 제어 패널 닫기");
    sidebarToggle.title = isCollapsed ? "패널 열기" : "패널 닫기";
    window.setTimeout(() => cy.resize(), 190);
  });

  function applyTypeFilter(type) {
    activeTypeFilter = type;
    if (document.querySelector("main").classList.contains("detail-open")) clearSelection();
    document.querySelectorAll(".type-filter").forEach((button) => {
      const active = button.dataset.type === type;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
    cy.nodes().removeClass("type-focus");
    if (!type) {
      cy.elements().removeClass("dim");
      requestAnimationFrame(restoreFilterViewport);
      return;
    }
    cy.nodes().forEach((n) => {
      const active = n.data("type") === type;
      n.toggleClass("dim", !active);
      n.toggleClass("type-focus", active);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
    requestAnimationFrame(() => focusTypeNodes(type));
  }

  function clearSelection() {
    cy.elements().unselect();
    cy.edges().removeClass("relationship-focus");
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
    document.querySelector("main").classList.remove("detail-open");
    cy.resize();
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    cy.edges().removeClass("relationship-focus");
    const node = cy.getElementById(conceptId);
    if (node) {
      node.select();
      node.connectedEdges('[relation = "grounded-in"], [relation = "cited-in"]')
        .addClass("relationship-focus");
    }

    document.querySelector("main").classList.add("detail-open");
    cy.resize();
    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    const isPaperSection = data.type === "Paper Section";
    const isSourceAsset = ["Image", "Table", "Formula"].includes(data.type);
    const isTerm = ["Core Term", "Prerequisite Term"].includes(data.type);
    document.querySelector(".detail-header").hidden = false;
    renderSectionNavigation(conceptId, isPaperSection);

    const body = bundle.bodies[conceptId] || "";
    const protectedMath = protectMath(body);
    const html = marked.parse(protectedMath.markdown, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);
    rewriteEmbeddedAssets(bodyEl, conceptId);
    renderProtectedMath(bodyEl, protectedMath.segments);
    removeRedundantBodyHeading(bodyEl, data.label);
    renderRelatedComponents(conceptId, data.type);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (!isPaperSection && !isSourceAsset && !isTerm && bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    document.getElementById("detail").scrollTop = 0;
    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function renderSectionNavigation(conceptId, isPaperSection) {
    const parentId = isPaperSection ? subsectionParent.get(conceptId) : null;
    const parent = document.getElementById("detail-parent");
    const parentLink = document.getElementById("detail-parent-link");
    parent.hidden = !parentId;
    parentLink.textContent = parentId ? nodeIndex[parentId]?.label || parentId : "";
    parentLink.onclick = parentId ? () => showDetail(parentId) : null;

    const nav = document.getElementById("detail-section-nav");
    nav.innerHTML = "";
    if (!isPaperSection) {
      nav.hidden = true;
      return;
    }

    const previousId = followedPrevious.get(conceptId);
    const nextId = followedNext.get(conceptId);
    if (previousId) nav.appendChild(makeSectionNavLink(previousId, "previous"));
    if (nextId) nav.appendChild(makeSectionNavLink(nextId, "next"));
    nav.hidden = !nav.children.length;
  }

  function makeSectionNavLink(targetId, direction) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "section-nav-link " + direction;
    button.addEventListener("click", () => showDetail(targetId));

    const directionLabel = document.createElement("span");
    directionLabel.className = "section-nav-direction";
    directionLabel.textContent = direction === "previous" ? "← Previous section" : "Next section →";
    button.appendChild(directionLabel);

    const title = document.createElement("span");
    title.className = "section-nav-title";
    title.textContent = nodeIndex[targetId]?.label || targetId;
    button.appendChild(title);
    return button;
  }

  function removeRedundantBodyHeading(root, title) {
    const firstHeading = root.querySelector("h1, h2, h3, h4, h5, h6");
    if (firstHeading?.textContent.trim() === title.trim()) firstHeading.remove();
  }

  function renderRelatedComponents(conceptId, conceptType) {
    const section = document.getElementById("detail-related");
    const container = document.getElementById("related-groups");
    container.innerHTML = "";
    const isPaperSection = conceptType === "Paper Section";
    const isSourceAsset = ["Image", "Table", "Formula"].includes(conceptType);
    const isTerm = ["Core Term", "Prerequisite Term"].includes(conceptType);
    if (!isPaperSection && !isSourceAsset && !isTerm) {
      section.hidden = true;
      return;
    }

    const groups = [];
    if (isPaperSection) {
      const children = (subsectionChildren.get(conceptId) || [])
        .map((id) => nodeIndex[id])
        .filter(Boolean);
      if (children.length) {
        groups.push({ label: "Subsections", items: children, color: "#2563eb" });
      }
    }

    if (isSourceAsset) {
      const sourceSectionId = citedSectionTarget.get(conceptId);
      const sourceSection = sourceSectionId ? nodeIndex[sourceSectionId] : null;
      if (sourceSection) {
        groups.push({ label: "Cited in sections", items: [sourceSection], color: "#2563eb" });
      }
    }

    if (isTerm) {
      const termTargetGroups = [
        ["Paper Section", "Grounded in", "#2563eb"],
      ];
      for (const [type, label, color] of termTargetGroups) {
        const items = bundle.nodes
          .map((node) => node.data)
          .filter((item) => {
            if (item.type !== type) return false;
            return relationshipSets["grounded-in"].has(conceptId + "\u0000" + item.id);
          })
          .sort((a, b) => a.label.localeCompare(b.label));
        if (items.length) groups.push({ label, items, color });
      }
    }

    if (isPaperSection) {
      const componentGroups = [
        ["Core Term", "Core terms"],
        ["Prerequisite Term", "Prerequisite terms"],
        ["Image", "Images"],
        ["Table", "Tables"],
        ["Formula", "Formulas"],
      ];
      for (const [type, label] of componentGroups) {
        const items = bundle.nodes
          .map((node) => node.data)
          .filter((item) => {
            if (item.type !== type) return false;
            const pair = item.id + "\u0000" + conceptId;
            if (["Image", "Table", "Formula"].includes(item.type)) {
              return citedSectionTarget.get(item.id) === conceptId;
            }
            return relationshipSets["grounded-in"].has(pair);
          })
          .sort((a, b) => a.label.localeCompare(b.label));
        if (items.length) groups.push({ label, items, color: items[0].color });
      }
    }

    for (const group of groups) container.appendChild(makeRelatedGroup(group));
    section.hidden = !groups.length;
  }

  function makeRelatedGroup(group) {
    const wrapper = document.createElement("section");
    wrapper.className = "related-group";

    const heading = document.createElement("h3");
    heading.className = "related-group-title";
    heading.append(document.createTextNode(group.label));
    const count = document.createElement("span");
    count.className = "related-count";
    count.textContent = group.items.length;
    heading.appendChild(count);
    wrapper.appendChild(heading);

    const items = document.createElement("div");
    items.className = "related-items";
    for (const item of group.items) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "related-link";
      button.style.setProperty("--related-color", group.color || item.color);
      button.textContent = item.label;
      button.addEventListener("click", () => showDetail(item.id));
      items.appendChild(button);
    }
    wrapper.appendChild(items);
    return wrapper;
  }

  function protectMath(markdown) {
    const segments = [];
    const store = (tex, display) => {
      const index = segments.push({ tex: tex.trim(), display }) - 1;
      const tag = display ? "div" : "span";
      const cls = display ? "okf-math-display" : "okf-math-inline";
      return `<${tag} class="${cls}" data-okf-math="${index}"></${tag}>`;
    };
    let protectedMarkdown = markdown.replace(/\$\$([\s\S]*?)\$\$/g, (_, tex) => store(tex, true));
    protectedMarkdown = protectedMarkdown.replace(/\$([^$\n]+)\$/g, (_, tex) => store(tex, false));
    return { markdown: protectedMarkdown, segments };
  }

  function renderProtectedMath(root, segments) {
    if (!window.katex) return;
    root.querySelectorAll("[data-okf-math]").forEach((element) => {
      const segment = segments[Number(element.dataset.okfMath)];
      if (!segment) return;
      window.katex.render(segment.tex, element, {
        displayMode: segment.display,
        throwOnError: false,
      });
    });
  }

  function rewriteEmbeddedAssets(root, conceptId) {
    root.querySelectorAll("img[data-asset-key]").forEach((img) => {
      const assetKey = img.dataset.assetKey;
      if (!/^image_\d+$/.test(assetKey || "")) return;
      img.setAttribute("src", `images/assets/${assetKey}.jpg`);
      img.setAttribute("alt", nodeIndex[`images/${assetKey}`]?.label || assetKey);
      wrapPaperAsset(img, "paper-asset-image");
    });

    root.querySelectorAll("table[data-asset-key]").forEach((table) => {
      wrapPaperAsset(table, "paper-asset-table");
    });

    root.querySelectorAll("display_formula[data-asset-key]").forEach((formula) => {
      wrapPaperAsset(formula, "paper-asset-formula");
    });

    root.querySelectorAll("img[src]").forEach((img) => {
      if (img.dataset.assetKey) return;
      const src = img.getAttribute("src");
      if (!src || /^(?:[a-z]+:|\/|#)/i.test(src)) return;
      const resolved = conceptId.split("/");
      resolved.pop();
      for (const segment of src.split("/")) {
        if (!segment || segment === ".") continue;
        if (segment === "..") resolved.pop();
        else resolved.push(segment);
      }
      img.setAttribute("src", resolved.join("/"));
    });
  }

  function wrapPaperAsset(element, className) {
    if (element.parentElement?.classList.contains("paper-asset")) return;
    const wrapper = document.createElement("div");
    wrapper.className = `paper-asset ${className}`;
    element.parentNode.insertBefore(wrapper, element);
    wrapper.appendChild(element);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

})();

</script>
</body>
