name: Deploy FE (dev)

on:
  push:
    branches: [main]
    paths: ['fe/**']
  workflow_dispatch:  # 현재 main 재배포용

permissions:
  id-token: write     # Github에게 OIDC 토큰 발급 요청 - AWS Role Assume
  contents: read

# 동시 배포 1개
concurrency:
  group: deploy-fe-dev
  cancel-in-progress: false # 진행 중 배포는 취소하지 않고 대기

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6  # OIDC to AWS STS => 임시 자격 get
        with:
          role-to-assume: ${{ vars.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # dev에서 검증한 dist를 그대로 prod에 올리기 위해 SHA별 tar로 보관한다. 같은 SHA 재배포면 건너뜀.
      - name: Archive build artifact
        run: |
          KEY="fe/${{ github.sha }}.tar.gz"
          if aws s3api head-object --bucket "${{ vars.ARTIFACTS_BUCKET }}" --key "$KEY" >/dev/null 2>&1; then
            echo "artifact already exists, skipping"
          else
            tar -czf fe.tar.gz -C dist .
            aws s3 cp fe.tar.gz "s3://${{ vars.ARTIFACTS_BUCKET }}/$KEY"
          fi
      - run: aws s3 sync dist/ "s3://${{ vars.DEV_FE_BUCKET }}" --delete  # build 산출물 버킷과 동기화
      - run: >  # CDN 캐시 무효화
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.DEV_CF_DISTRIBUTION_ID }}"
          --paths "/*"
