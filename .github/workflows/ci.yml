name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # paths-filter가 PR 변경 파일 목록 API를 읽는다

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 변경 경로로 판단
  changes:
    runs-on: ubuntu-latest
    outputs:
      fe: ${{ steps.filter.outputs.fe }}
      be: ${{ steps.filter.outputs.be }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |  # 액션에 넘기는 입력
            fe:
              - 'fe/**'
            be:
              - 'be/**'

  fe-ci:
    needs: changes    # changes 잡 종료 후 시작
    if: needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4   # code checkout at runner VM
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  be-ci:
    needs: changes
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-24.04-arm # same as Fargate env
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4 # same as BE(java_21)
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew test
      - run: docker build -t backend-ci .
