name: Deploy BE (dev)

on:
  push:
    branches: [main]
    paths: ['be/**']
  workflow_dispatch: # 현재 main 재배포용

permissions:
  id-token: write # OIDC 토큰 발급
  contents: read

# 동시 배포 1개
concurrency:
  group: deploy-be-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # 머지 후 main은 PR 시점과 다를 수 있어 배포되는 커밋을 재검증한다.
      - run: ./gradlew test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push image
        id: build
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.DEV_BE_ECR_REPO }}:${{ github.sha }}"
          # IMMUTABLE repo라 같은 SHA 재실행(재배포) 시 push가 거부된다 — 있으면 기존 이미지 재사용.
          # 존재 확인은 배포 Role이 이미 가진 ecr:BatchGetImage로 한다.
          FOUND=$(aws ecr batch-get-image \
            --repository-name "${{ vars.DEV_BE_ECR_REPO }}" \
            --image-ids imageTag="${{ github.sha }}" \
            --query 'length(images)' --output text)
          if [ "$FOUND" != "0" ]; then
            echo "image already in ECR, skipping build and push"
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      # 현재 태스크 정의를 복제해 이미지만 교체한 새 revision을 등록한다.
      # 환경변수·리소스 설정은 Terraform이 만든 기존 revision을 그대로 상속.
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.DEV_BE_TASK_FAMILY }}" \
            --query taskDefinition > task-def.json
      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: be/task-def.json # working-directory는 run 스텝에만 적용
          container-name: ${{ vars.DEV_BE_CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.DEV_BE_SERVICE }}
          cluster: ${{ vars.DEV_ECS_CLUSTER }}
          wait-for-service-stability: true
